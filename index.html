<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#F2F2F7"/>
<title>Fahrplan</title>
<style>
/* ============================================
   iOS Human Interface Guidelines — exakt
   ============================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* iOS System Colors */
:root{
  --bg:          #F2F2F7;
  --bg2:         #FFFFFF;
  --grouped-bg:  #F2F2F7;
  --cell-bg:     #FFFFFF;
  --label:       #000000;
  --label2:      rgba(60,60,67,.6);
  --label3:      rgba(60,60,67,.3);
  --label4:      rgba(60,60,67,.18);
  --sep:         rgba(60,60,67,.29);
  --sep-light:   rgba(60,60,67,.12);
  --fill:        rgba(120,120,128,.12);
  --fill2:       rgba(120,120,128,.16);
  --blue:        #007AFF;
  --red:         #FF3B30;
  --green:       #34C759;
  --orange:      #FF9500;
  --gray:        #8E8E93;
  --gray2:       #AEAEB2;
  --gray3:       #C7C7CC;
  --gray4:       #D1D1D6;
  --gray5:       #E5E5EA;
  --gray6:       #F2F2F7;
  --brand:       #EC0016;
  --safe-top:    env(safe-area-inset-top, 47px);
  --safe-bot:    env(safe-area-inset-bottom, 34px);
}

html, body {
  height: 100%;
  background: var(--bg);
  overscroll-behavior: none;
}

body {
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  color: var(--label);
  -webkit-font-smoothing: antialiased;
  font-size: 17px;
  line-height: 1.29;
}

/* ── Nav Bar (Large Title) ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(242,242,247,.94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: .5px solid var(--sep);
}
.nav-inner {
  padding-top: var(--safe-top);
  padding-bottom: 8px;
  padding-left: 16px;
  padding-right: 16px;
}
.nav-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .37px;
  line-height: 41px;
}

/* ── Tab Bar ── */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(249,249,249,.94);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-top: .5px solid var(--sep);
  display: flex;
  padding-bottom: var(--safe-bot);
}
.tabitem {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6px 0 0;
  height: calc(49px + 0px);
  border: none; background: none; cursor: pointer;
  font-family: inherit;
  color: var(--gray);
  gap: 2px;
  transition: color .15s;
}
.tabitem.on { color: var(--brand); }
.tab-ico { font-size: 24px; line-height: 1; }
.tab-lbl { font-size: 10px; font-weight: 500; letter-spacing: .12px; }

/* ── Page Containers ── */
.page {
  display: none;
  min-height: 100dvh;
}
.page.on { display: block; }

.scroll-area {
  padding-top: calc(var(--safe-top) + 52px + 44px);
  padding-bottom: calc(var(--safe-bot) + 49px + 16px);
}

/* ── Inset Grouped Section ── */
.section {
  margin: 0 16px 32px;
}
.section-title {
  font-size: 13px;
  font-weight: 400;
  color: var(--label2);
  text-transform: uppercase;
  letter-spacing: -.08px;
  margin-bottom: 8px;
  padding-left: 16px;
}
.section-footer {
  font-size: 13px;
  color: var(--label2);
  margin-top: 8px;
  padding-left: 16px;
}
.cell-group {
  background: var(--cell-bg);
  border-radius: 10px;
  overflow: hidden;
}
.cell {
  display: flex; align-items: center;
  padding: 11px 16px;
  min-height: 44px;
  gap: 12px;
  position: relative;
  background: var(--cell-bg);
}
.cell + .cell::before {
  content: '';
  position: absolute;
  top: 0; left: 16px; right: 0;
  height: .5px;
  background: var(--sep-light);
}

/* ── Text Fields ── */
.ifield {
  flex: 1; min-width: 0;
  font-size: 17px;
  font-family: inherit;
  color: var(--label);
  border: none; outline: none;
  background: transparent;
}
.ifield::placeholder { color: var(--label3); }

.cell-icon {
  width: 29px; height: 29px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.ci-green { background: var(--green); }
.ci-red   { background: var(--brand); }
.ci-blue  { background: var(--blue); }
.ci-gray  { background: var(--gray4); }
.ci-orange{ background: var(--orange); }

/* Swap divider */
.swap-divider {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 16px;
  position: relative;
}
.swap-line { flex: 1; height: .5px; background: var(--sep-light); }
.swap-circle {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--fill);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--label2);
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .15s;
  flex-shrink: 0;
}
.swap-circle:active { transform: rotate(180deg); background: var(--gray4); }

/* Time cells */
.time-seg {
  display: flex; gap: 0;
  background: var(--cell-bg);
  border-radius: 10px; overflow: hidden;
}
.time-seg > * {
  flex: 1; min-width: 0;
  padding: 11px 12px;
  font-size: 15px; font-weight: 500;
  font-family: inherit; color: var(--label);
  border: none; outline: none;
  background: transparent; text-align: center;
  appearance: none;
}
.time-seg > * + * { border-left: .5px solid var(--sep-light); }

/* Blue CTA */
.cta-btn {
  display: block; width: 100%;
  padding: 14px;
  font-size: 17px; font-weight: 600;
  font-family: inherit; color: #fff;
  background: var(--brand);
  border: none; border-radius: 10px;
  cursor: pointer; letter-spacing: .35px;
  transition: opacity .12s;
}
.cta-btn:active { opacity: .82; }
.cta-btn:disabled { opacity: .4; }

/* Suggestions */
.sug-list {
  position: absolute;
  top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
  background: var(--cell-bg);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.08);
  max-height: 290px; overflow-y: auto;
}
.sug-cell {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 16px;
  cursor: pointer;
  position: relative;
}
.sug-cell + .sug-cell::before {
  content: ''; position: absolute;
  top: 0; left: 16px; right: 0; height: .5px;
  background: var(--sep-light);
}
.sug-cell:active { background: var(--fill); }
.sug-ico {
  width: 29px; height: 29px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
  background: var(--fill);
}
.sug-name { font-size: 16px; }
.sug-hint { font-size: 12px; color: var(--label2); margin-top: 1px; }
.sug-msg { padding: 14px 16px; font-size: 15px; color: var(--label2); text-align: center; }

/* Journey Card */
.jcard {
  background: var(--cell-bg);
  border-radius: 10px;
  margin-bottom: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: opacity .1s;
}
.jcard:active { opacity: .7; }

.j-row {
  display: grid;
  grid-template-columns: 72px 1fr 72px;
  gap: 0;
  padding: 14px 16px 10px;
  align-items: center;
}
.j-time {
  font-size: 22px; font-weight: 700;
  letter-spacing: -.5px;
  font-variant-numeric: tabular-nums;
}
.j-delay {
  font-size: 11px; font-weight: 600;
  margin-top: 2px;
}
.j-delay.ok  { color: var(--green); }
.j-delay.late { color: var(--red); }
.j-end { text-align: right; }
.j-end .j-time { text-align: right; }
.j-end .j-delay { text-align: right; }

.j-mid {
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  padding: 0 8px;
}
.j-dur {
  font-size: 12px; color: var(--label2); font-weight: 500;
}
.j-bar {
  width: 100%; height: 2px; background: var(--gray4);
  border-radius: 2px; position: relative;
}
.j-bar::before, .j-bar::after {
  content: ''; position: absolute; top: 50%;
  transform: translateY(-50%);
  width: 6px; height: 6px; border-radius: 50%;
}
.j-bar::before { left: -1px; background: var(--green); }
.j-bar::after  { right: -1px; background: var(--brand); }
.j-chg { font-size: 11px; color: var(--label2); }

.j-pills {
  display: flex; gap: 4px; flex-wrap: wrap;
  padding: 0 16px 12px;
}
.pill {
  padding: 2px 8px; border-radius: 5px;
  font-size: 12px; font-weight: 700;
  color: #fff; letter-spacing: .2px;
}

.j-sep { height: .5px; background: var(--sep-light); margin: 0 16px; }

.j-chevron {
  display: flex; align-items: center; justify-content: center;
  gap: 4px; padding: 8px 0;
  font-size: 12px; color: var(--label3); font-weight: 500;
}
.chev {
  display: inline-block; font-size: 10px; color: var(--label3);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1);
}
.chev.open { transform: rotate(180deg); }

/* Detail expand */
.j-detail {
  display: none;
  background: var(--grouped-bg);
  padding: 12px 16px;
  border-top: .5px solid var(--sep-light);
}
.j-detail.open { display: block; }

.leg { display: flex; gap: 0; margin-bottom: 0; }
.leg-tl {
  display: flex; flex-direction: column;
  align-items: center; width: 32px; flex-shrink: 0;
  padding-top: 4px;
}
.leg-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid var(--grouped-bg); z-index: 1;
}
.leg-dot.s { background: var(--green); }
.leg-dot.e { background: var(--brand); }
.leg-dot.w { background: var(--gray3); }
.leg-line {
  width: 2px; border-radius: 2px; flex: 1;
  min-height: 22px; margin: 2px 0;
}
.leg-body { flex: 1; padding-bottom: 14px; }
.leg-time {
  font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.leg-dly { font-size: 11px; font-weight: 600; margin-left: 6px; }
.leg-dly.ok   { color: var(--green); }
.leg-dly.late { color: var(--red); }
.leg-station { font-size: 15px; font-weight: 600; margin-top: 1px; }
.leg-plat {
  display: inline-block; font-size: 11px; font-weight: 600;
  color: var(--label2); background: var(--gray5);
  border-radius: 5px; padding: 1px 7px; margin-top: 3px;
}
.leg-line-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0 2px;
}
.leg-dir { font-size: 13px; color: var(--label2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.walk-cell {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 0; font-size: 13px; color: var(--label2);
}

/* Live indicator */
.live-row {
  display: flex; align-items: center; gap: 7px;
  padding: 2px 0 10px; font-size: 13px; color: var(--label2);
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); flex-shrink: 0;
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}

/* Departure Board */
.dep-cell {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; min-height: 52px;
  position: relative;
}
.dep-cell + .dep-cell::before {
  content: ''; position: absolute;
  top: 0; left: 16px; right: 0;
  height: .5px; background: var(--sep-light);
}
.dep-info { flex: 1; min-width: 0; }
.dep-dest { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dep-plat { font-size: 12px; color: var(--label2); margin-top: 2px; }
.dep-right { flex-shrink: 0; text-align: right; }
.dep-time { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.dep-delay { font-size: 11px; font-weight: 700; margin-top: 2px; }
.dep-delay.ok   { color: var(--green); }
.dep-delay.late { color: var(--red); }

/* Favorites */
.fav-cell {
  display: flex; align-items: center; gap: 14px;
  padding: 11px 16px; min-height: 52px;
  position: relative;
}
.fav-cell + .fav-cell::before {
  content: ''; position: absolute;
  top: 0; left: 60px; right: 0;
  height: .5px; background: var(--sep-light);
}
.fav-ico {
  width: 36px; height: 36px; border-radius: 9px;
  background: rgba(236,0,22,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.fav-text { flex: 1; min-width: 0; }
.fav-name { font-size: 16px; font-weight: 500; }
.fav-sub  { font-size: 13px; color: var(--label2); margin-top: 1px; }
.fav-del  { border: none; background: none; color: var(--gray2); font-size: 22px; cursor: pointer; padding: 4px; }
.fav-del:active { color: var(--red); }

/* Star save button */
.star-btn {
  border: none; background: none; cursor: pointer; padding: 4px;
  font-size: 20px; color: var(--gray2); transition: transform .15s;
}
.star-btn:active { transform: scale(1.3); }
.star-btn.on { color: var(--orange); }

/* States */
.loading {
  display: flex; justify-content: center;
  padding: 48px 0;
}
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--gray4);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  padding: 60px 16px; text-align: center; color: var(--label2);
}
.empty-ico { font-size: 52px; margin-bottom: 12px; }
.empty-txt { font-size: 15px; line-height: 1.5; }
.empty-sub { font-size: 13px; color: var(--label3); margin-top: 6px; }

.err {
  margin: 0 16px;
  background: var(--cell-bg); border-radius: 10px;
  padding: 14px 16px; font-size: 14px; color: var(--red); line-height: 1.5;
}
</style>
</head>
<body>

<!-- ▸ Nav Bar -->
<div class="nav">
  <div class="nav-inner">
    <div class="nav-title" id="nav-title">Verbindungen</div>
  </div>
</div>

<!-- ▸▸ PAGE 1: SUCHEN -->
<div class="page on" id="p-search">
<div class="scroll-area">

  <div class="section" style="margin-top:0">
    <!-- Von / Nach -->
    <div class="cell-group" style="overflow:visible">
      <div class="cell" style="position:relative">
        <div class="cell-icon ci-green">🟢</div>
        <input class="ifield" id="from-input" placeholder="Abfahrt" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <div class="sug-list" id="from-sug" style="display:none"></div>
      </div>
      <div class="swap-divider" style="height:1px;padding:0;margin:0 0 0 57px">
        <div class="swap-line"></div>
        <button class="swap-circle" onclick="swap()">⇅</button>
        <div class="swap-line" style="flex:2"></div>
      </div>
      <div class="cell" style="position:relative">
        <div class="cell-icon ci-red" style="font-size:12px">📍</div>
        <input class="ifield" id="to-input" placeholder="Ankunft" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <div class="sug-list" id="to-sug" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:-20px">
    <div class="time-seg">
      <select id="dep-arr" style="color:var(--label2)">
        <option value="dep">Abfahrt</option>
        <option value="arr">Ankunft</option>
      </select>
      <input type="date" id="tdate"/>
      <input type="time" id="ttime"/>
    </div>
  </div>

  <div class="section" style="margin-top:-20px">
    <button class="cta-btn" id="go-btn" onclick="search()">Suchen</button>
  </div>

  <div id="results"></div>

</div>
</div>

<!-- ▸▸ PAGE 2: ABFAHRTEN -->
<div class="page" id="p-dep">
<div class="scroll-area">

  <div class="section" style="margin-top:0">
    <div class="cell-group" style="overflow:visible">
      <div class="cell" style="position:relative">
        <div class="cell-icon ci-gray">🔍</div>
        <input class="ifield" id="dep-input" placeholder="Bahnhof oder Haltestelle" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <div class="sug-list" id="dep-sug" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="dep-results">
    <div class="empty">
      <div class="empty-ico">🕑</div>
      <div class="empty-txt">Bahnhof eingeben</div>
      <div class="empty-sub">Die nächsten Abfahrten werden angezeigt</div>
    </div>
  </div>

</div>
</div>

<!-- ▸▸ PAGE 3: FAVORITEN -->
<div class="page" id="p-fav">
<div class="scroll-area">
  <div id="fav-content">
    <div class="empty">
      <div class="empty-ico">⭐</div>
      <div class="empty-txt">Keine Favoriten</div>
      <div class="empty-sub">Bahnhöfe unter Abfahrten mit ★ merken</div>
    </div>
  </div>
</div>
</div>

<!-- ▸ Tab Bar -->
<nav class="tabbar">
  <button class="tabitem on" data-p="search" onclick="goTab(this)">
    <span class="tab-ico">🔍</span>
    <span class="tab-lbl">Suchen</span>
  </button>
  <button class="tabitem" data-p="dep" onclick="goTab(this)">
    <span class="tab-ico">🕑</span>
    <span class="tab-lbl">Abfahrten</span>
  </button>
  <button class="tabitem" data-p="fav" onclick="goTab(this)">
    <span class="tab-ico">⭐</span>
    <span class="tab-lbl">Favoriten</span>
  </button>
</nav>

<script>
'use strict';
const DB   = 'https://v6.db.transport.rest';
const GEO  = 'https://api.transitous.org/api/v1/geocode';
const PLAN = 'https://api.transitous.org/api/v3/plan';
const DEPAPI = 'https://api.transitous.org/api/v1/stoptimes';

let FROM=null, TO=null, DEPST=null;
let sug={from:[],to:[],dep:[]};
let tmr={};
let dbOk=true;

// Init date+time
const N=new Date();
document.getElementById('tdate').value=N.toISOString().slice(0,10);
document.getElementById('ttime').value=N.toTimeString().slice(0,5);

/* ── Tabs ── */
const TITLES={search:'Verbindungen',dep:'Abfahrten',fav:'Favoriten'};
function goTab(btn){
  const p=btn.dataset.p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tabitem').forEach(x=>x.classList.remove('on'));
  document.getElementById(`p-${p}`).classList.add('on');
  btn.classList.add('on');
  document.getElementById('nav-title').textContent=TITLES[p];
  if(p==='fav') renderFavs();
  window.scrollTo({top:0,behavior:'instant'});
}

/* ── Colors ── */
function lc(name){
  if(!name) return '#8E8E93';
  const n=name.toUpperCase();
  if(/ICE/.test(n)) return '#EC0016';
  if(/^IC|^EC/.test(n)) return '#c4000f';
  if(/^RE|^RB/.test(n)) return '#0066CC';
  if(/^S\d/.test(n)) return '#007E3C';
  if(/^U\d/.test(n)) return '#1C4B9B';
  if(/STR|^T\d|^M\d/.test(n)) return '#C0003C';
  if(/BUS|NB/.test(n)) return '#7C3AED';
  return '#555';
}
function mc(mode){
  switch((mode||'').toUpperCase()){
    case 'HIGHSPEED_RAIL': return '#EC0016';
    case 'LONG_DISTANCE':  return '#c4000f';
    case 'REGIONAL_FAST_RAIL':
    case 'REGIONAL_RAIL':
    case 'RAIL':           return '#0066CC';
    case 'SUBURBAN':
    case 'METRO':
    case 'SUBWAY':         return '#007E3C';
    case 'TRAM':           return '#C0003C';
    case 'BUS':
    case 'COACH':          return '#7C3AED';
    case 'FERRY':          return '#0891B2';
    default:               return '#8E8E93';
  }
}
function mi(products){
  if(!products) return '🚉';
  if(products.nationalExpress||products.national) return '🚄';
  if(products.regionalExpress||products.regional) return '🚆';
  if(products.suburban) return '🚊';
  if(products.subway) return '🚇';
  if(products.tram) return '🚋';
  if(products.bus) return '🚌';
  return '🚉';
}
function mim(modes){
  if(!modes||!modes.length) return '🚉';
  const o=['HIGHSPEED_RAIL','LONG_DISTANCE','REGIONAL_RAIL','SUBURBAN','SUBWAY','METRO','TRAM','BUS'];
  for(const m of o){
    if(!modes.includes(m)) continue;
    if(m==='HIGHSPEED_RAIL'||m==='LONG_DISTANCE') return '🚄';
    if(m==='REGIONAL_RAIL') return '🚆';
    if(m==='SUBURBAN') return '🚊';
    if(m==='SUBWAY'||m==='METRO') return '🚇';
    if(m==='TRAM') return '🚋';
    if(m==='BUS') return '🚌';
  }
  return '🚉';
}

/* ── Format ── */
function ft(iso){ return iso?new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'--:--'; }
function ds(s){ if(!s||s<0)return'?'; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?`${h}h ${m}m`:`${m} min`; }
function dm(a,b){ return(a&&b)?Math.round((new Date(b)-new Date(a))/60000):0; }

/* ── Autocomplete ── */
async function fetchS(q,f){
  if(q.length<2){hideSug(f);return;}
  const b=document.getElementById(`${f}-sug`);
  b.innerHTML='<div class="sug-msg">Suche…</div>'; b.style.display='block';

  if(dbOk){
    try{
      const r=await fetch(`${DB}/locations?query=${encodeURIComponent(q)}&results=10&stops=true&addresses=false&poi=false`,{signal:AbortSignal.timeout(5000)});
      if(r.ok){
        const d=await r.json();
        sug[f]=(d||[]).map(s=>({id:s.id,name:s.name,lat:s.location?.latitude,lon:s.location?.longitude,products:s.products,_db:true,_ico:mi(s.products)}));
        renderS(f); return;
      }
    }catch{dbOk=false;}
  }

  try{
    const r=await fetch(`${GEO}?text=${encodeURIComponent(q)}&language=de`);
    if(!r.ok) throw 0;
    const d=await r.json();
    const RL=['HIGHSPEED_RAIL','LONG_DISTANCE','REGIONAL_RAIL','REGIONAL_FAST_RAIL','SUBURBAN','RAIL'];
    const stops=(d||[]).filter(x=>x.type==='STOP');
    stops.sort((a,b)=>{
      const aR=(a.modes||[]).some(m=>RL.includes(m));
      const bR=(b.modes||[]).some(m=>RL.includes(m));
      if(aR&&!bR)return -1; if(!aR&&bR)return 1;
      return(b.importance||0)-(a.importance||0);
    });
    sug[f]=stops.slice(0,10).map(s=>({id:s.id,name:s.name,lat:s.lat,lon:s.lon,modes:s.modes,_db:false,_ico:mim(s.modes)}));
    renderS(f);
  }catch{ b.innerHTML='<div class="sug-msg">Keine Ergebnisse</div>'; }
}

function renderS(f){
  const b=document.getElementById(`${f}-sug`);
  const items=sug[f];
  if(!items.length){b.innerHTML='<div class="sug-msg">Kein Bahnhof gefunden</div>';return;}
  b.innerHTML=items.map((s,i)=>`<div class="sug-cell" onclick="pick(${i},'${f}')">
    <div class="sug-ico">${s._ico}</div>
    <div><div class="sug-name">${s.name}</div></div>
  </div>`).join('');
}
function hideSug(f){const b=document.getElementById(`${f}-sug`);if(b)b.style.display='none';}
function pick(i,f){
  const s=sug[f][i]; if(!s) return;
  document.getElementById(`${f}-input`).value=s.name;
  if(f==='from') FROM=s; else if(f==='to') TO=s; else{DEPST=s;loadDep();}
  hideSug(f);
}
function setF(f){
  const inp=document.getElementById(`${f}-input`);
  inp.addEventListener('input',()=>{
    if(f==='from')FROM=null; else if(f==='to')TO=null; else DEPST=null;
    clearTimeout(tmr[f]);
    tmr[f]=setTimeout(()=>fetchS(inp.value.trim(),f),220);
  });
  inp.addEventListener('blur',()=>setTimeout(()=>hideSug(f),180));
  inp.addEventListener('focus',()=>{if(inp.value.length>=2&&sug[f].length)document.getElementById(`${f}-sug`).style.display='block';});
}
['from','to','dep'].forEach(setF);

function swap(){
  const a=document.getElementById('from-input'),b=document.getElementById('to-input');
  [a.value,b.value]=[b.value,a.value]; [FROM,TO]=[TO,FROM];
}

/* ── Journey Renderers ── */
function toggleD(i){
  document.getElementById(`jd-${i}`).classList.toggle('open');
  document.getElementById(`jc-${i}`).classList.toggle('open');
}

function renderJDB(j,i){
  const legs=j.legs||[];
  const tr=legs.filter(l=>!l.walking);
  if(!tr.length) return '';
  const f=tr[0], la=tr[tr.length-1];
  const dR=f.departure||f.plannedDeparture, dS=f.plannedDeparture;
  const aR=la.arrival||la.plannedArrival, aS=la.plannedArrival;
  const dd=dm(dS,dR), da=dm(aS,aR);
  const dur=(new Date(aR)-new Date(dR))/1000;
  const chg=tr.length-1;
  const pills=tr.map(l=>`<span class="pill" style="background:${lc(l.line?.name)}">${l.line?.name||'?'}</span>`).join('');
  const det=legs.map((l,k)=>{
    if(l.walking){
      const m=Math.ceil((new Date(l.arrival)-new Date(l.departure))/60000);
      return`<div class="leg">
        <div class="leg-tl"><div class="leg-dot w"></div>
        <div class="leg-line" style="background:repeating-linear-gradient(to bottom,#C7C7CC 0,#C7C7CC 4px,transparent 4px,transparent 9px)"></div></div>
        <div class="leg-body"><div class="walk-cell">🚶 ${m||1} min Fußweg</div></div></div>`;
    }
    const last=k===legs.length-1;
    const col=lc(l.line?.name);
    const dr=l.departure||l.plannedDeparture, ds=l.plannedDeparture;
    const ar=l.arrival||l.plannedArrival, as_=l.plannedArrival;
    const dd2=dm(ds,dr), da2=dm(as_,ar);
    const op=l.departurePlatform||l.plannedDeparturePlatform||'';
    const ap=l.arrivalPlatform||l.plannedArrivalPlatform||'';
    return`<div class="leg">
      <div class="leg-tl"><div class="leg-dot s"></div><div class="leg-line" style="background:${col}"></div></div>
      <div class="leg-body">
        <span class="leg-time">${ft(dr)}</span><span class="leg-dly ${dd2<=0?'ok':'late'}">${dd2<=0?'pünktlich':'+'+dd2+' min'}</span>
        <div class="leg-station">${l.origin?.name||'?'}</div>
        ${op?`<span class="leg-plat">Gleis ${op}</span>`:''}
        <div class="leg-line-row">
          <span class="pill" style="background:${col}">${l.line?.name||'?'}</span>
          <span class="leg-dir">Richtung ${l.direction||l.destination?.name||''}</span>
        </div>
      </div></div>
    ${last?`<div class="leg">
      <div class="leg-tl"><div class="leg-dot e"></div></div>
      <div class="leg-body">
        <span class="leg-time">${ft(ar)}</span><span class="leg-dly ${da2<=0?'ok':'late'}">${da2<=0?'pünktlich':'+'+da2+' min'}</span>
        <div class="leg-station">${l.destination?.name||'?'}</div>
        ${ap?`<span class="leg-plat">Gleis ${ap}</span>`:''}
      </div></div>`:''}`;
  }).join('');
  return`<div class="jcard" onclick="toggleD(${i})">
    <div class="j-row">
      <div><div class="j-time">${ft(dR)}</div><div class="j-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktlich':'+'+dd+' min'}</div></div>
      <div class="j-mid"><div class="j-dur">${ds(dur)}</div><div class="j-bar"></div><div class="j-chg">${chg===0?'Direkt':chg+' Umst.'}</div></div>
      <div class="j-end"><div class="j-time">${ft(aR)}</div><div class="j-delay ${da<=0?'ok':'late'}">${da<=0?'pünktlich':'+'+da+' min'}</div></div>
    </div>
    <div class="j-pills">${pills}</div>
    <div class="j-sep"></div>
    <div class="j-chevron">Details <span class="chev" id="jc-${i}">▾</span></div>
    <div class="j-detail" id="jd-${i}">${det}</div>
  </div>`;
}

function renderJT(it,i){
  const legs=it.legs||[];
  const SKIP=['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL','COACH'];
  const tr=legs.filter(l=>l.mode!=='WALK');
  if(!tr.length||tr.some(l=>SKIP.includes(l.mode))) return '';
  const f=tr[0], la=tr[tr.length-1];
  const dR=f.from?.departure||f.startTime, dS=f.from?.scheduledDeparture||f.scheduledStartTime;
  const aR=la.to?.arrival||la.endTime, aS=la.to?.scheduledArrival||la.scheduledEndTime;
  const dd=f.realTime?dm(dS,dR):0, da=la.realTime?dm(aS,aR):0;
  const chg=it.transfers??Math.max(0,tr.length-1);
  const pills=tr.map(l=>`<span class="pill" style="background:${mc(l.mode)}">${l.routeShortName||l.displayName||'?'}</span>`).join('');
  const det=legs.map((l,k)=>{
    if(l.mode==='WALK'){
      const m=Math.round((l.duration||0)/60);
      return`<div class="leg">
        <div class="leg-tl"><div class="leg-dot w"></div>
        <div class="leg-line" style="background:repeating-linear-gradient(to bottom,#C7C7CC 0,#C7C7CC 4px,transparent 4px,transparent 9px)"></div></div>
        <div class="leg-body"><div class="walk-cell">🚶 ${m||1} min Fußweg</div></div></div>`;
    }
    const last=k===legs.length-1;
    const col=mc(l.mode);
    const n=l.routeShortName||l.displayName||'?';
    const dr=l.from?.departure||l.startTime, ds=l.from?.scheduledDeparture||l.scheduledStartTime;
    const ar=l.to?.arrival||l.endTime, as_=l.to?.scheduledArrival||l.scheduledEndTime;
    const dd2=l.realTime?dm(ds,dr):0, da2=l.realTime?dm(as_,ar):0;
    const ot=l.from?.track||l.from?.scheduledTrack||'';
    const dt=l.to?.track||l.to?.scheduledTrack||'';
    return`<div class="leg">
      <div class="leg-tl"><div class="leg-dot s"></div><div class="leg-line" style="background:${col}"></div></div>
      <div class="leg-body">
        <span class="leg-time">${ft(dr)}</span><span class="leg-dly ${dd2<=0?'ok':'late'}">${dd2<=0?'pünktlich':'+'+dd2+' min'}</span>
        <div class="leg-station">${l.from?.name||'?'}</div>
        ${ot?`<span class="leg-plat">Gleis ${ot}</span>`:''}
        <div class="leg-line-row">
          <span class="pill" style="background:${col}">${n}</span>
          <span class="leg-dir">Richtung ${l.headsign||l.to?.name||''}</span>
        </div>
      </div></div>
    ${last?`<div class="leg">
      <div class="leg-tl"><div class="leg-dot e"></div></div>
      <div class="leg-body">
        <span class="leg-time">${ft(ar)}</span><span class="leg-dly ${da2<=0?'ok':'late'}">${da2<=0?'pünktlich':'+'+da2+' min'}</span>
        <div class="leg-station">${l.to?.name||'?'}</div>
        ${dt?`<span class="leg-plat">Gleis ${dt}</span>`:''}
      </div></div>`:''}`;
  }).join('');
  return`<div class="jcard" onclick="toggleD(${i})">
    <div class="j-row">
      <div><div class="j-time">${ft(dR)}</div><div class="j-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktlich':'+'+dd+' min'}</div></div>
      <div class="j-mid"><div class="j-dur">${ds(it.duration)}</div><div class="j-bar"></div><div class="j-chg">${chg===0?'Direkt':chg+' Umst.'}</div></div>
      <div class="j-end"><div class="j-time">${ft(aR)}</div><div class="j-delay ${da<=0?'ok':'late'}">${da<=0?'pünktlich':'+'+da+' min'}</div></div>
    </div>
    <div class="j-pills">${pills}</div>
    <div class="j-sep"></div>
    <div class="j-chevron">Details <span class="chev" id="jc-${i}">▾</span></div>
    <div class="j-detail" id="jd-${i}">${det}</div>
  </div>`;
}

/* ── Search ── */
async function search(){
  if(!FROM||!TO){alert('Bitte Start und Ziel aus der Liste wählen.');return;}
  const btn=document.getElementById('go-btn');
  btn.disabled=true; btn.textContent='Suche…';
  document.getElementById('results').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  const date=document.getElementById('tdate').value, time=document.getElementById('ttime').value;
  const arrBy=document.getElementById('dep-arr').value==='arr';
  const when=new Date(`${date}T${time}:00`).toISOString();

  if(dbOk&&FROM._db&&TO._db){
    try{
      const p=new URLSearchParams({from:FROM.id,to:TO.id,results:'8',stopovers:'false',remarks:'false',language:'de'});
      p.set(arrBy?'arrival':'departure',when);
      const r=await fetch(`${DB}/journeys?${p}`,{signal:AbortSignal.timeout(8000)});
      if(r.ok){
        const d=await r.json();
        const cards=(d.journeys||[]).map((j,i)=>renderJDB(j,i)).filter(Boolean);
        showR(cards,true); btn.disabled=false; btn.textContent='Suchen'; return;
      }
    }catch{dbOk=false;}
  }

  try{
    const p=new URLSearchParams({fromPlace:`${FROM.lat},${FROM.lon}`,toPlace:`${TO.lat},${TO.lon}`,time:when,arriveBy:String(arrBy),numItineraries:'8'});
    const r=await fetch(`${PLAN}?${p}`);
    if(!r.ok) throw new Error(`Fehler ${r.status}`);
    const d=await r.json();
    const cards=(d.itineraries||[]).map((it,i)=>renderJT(it,i)).filter(Boolean);
    showR(cards,false);
  }catch(e){
    document.getElementById('results').innerHTML=`<div class="err">❌ ${e.message}</div>`;
  }
  btn.disabled=false; btn.textContent='Suchen';
}
function showR(cards,rt){
  const box=document.getElementById('results');
  if(!cards.length){
    box.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-txt">Keine Verbindungen</div><div class="empty-sub">Anderen Zeitpunkt versuchen</div></div>';
    return;
  }
  box.innerHTML=`<div class="section" style="margin-top:0">
    <div class="live-row"><div class="live-dot"></div>${cards.length} Verbindungen${rt?' · DB Echtzeit':''}</div>
    ${cards.join('')}
  </div>`;
}

/* ── Departures ── */
async function loadDep(){
  if(!DEPST) return;
  const box=document.getElementById('dep-results');
  box.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  if(dbOk&&DEPST._db){
    try{
      const r=await fetch(`${DB}/stops/${encodeURIComponent(DEPST.id)}/departures?results=20&duration=120`,{signal:AbortSignal.timeout(6000)});
      if(r.ok){const d=await r.json();renderDepDB(d.departures||d);return;}
    }catch{dbOk=false;}
  }
  try{
    const r=await fetch(`${DEPAPI}?stopId=${encodeURIComponent(DEPST.id)}&n=20&time=${new Date().toISOString()}`);
    if(!r.ok) throw new Error(`Fehler ${r.status}`);
    const d=await r.json();
    renderDepT(d.stopTimes||[]);
  }catch(e){box.innerHTML=`<div class="err">❌ ${e.message}</div>`;}
}
function depHeader(){
  const s=isFav(DEPST.id);
  return`<div class="section" style="margin-top:0">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px">
      <div style="font-size:20px;font-weight:700">${DEPST.name}</div>
      <button class="star-btn ${s?'on':''}" onclick="toggleFav()">${s?'★':'☆'}</button>
    </div>
    <div class="cell-group">`;
}
function renderDepDB(deps){
  if(!deps.length){document.getElementById('dep-results').innerHTML='<div class="empty"><div class="empty-ico">😴</div><div class="empty-txt">Keine Abfahrten</div></div>';return;}
  const rows=deps.map(d=>{
    const col=lc(d.line?.name);
    const dr=d.when||d.plannedWhen, ds=d.plannedWhen;
    const dd=dm(ds,dr);
    const pl=d.platform||d.plannedPlatform||'';
    return`<div class="dep-cell">
      <span class="pill" style="background:${col};font-size:12px;flex-shrink:0">${d.line?.name||'?'}</span>
      <div class="dep-info">
        <div class="dep-dest">${d.direction||'?'}</div>
        ${pl?`<div class="dep-plat">Gleis ${pl}</div>`:''}
      </div>
      <div class="dep-right">
        <div class="dep-time">${ft(dr)}</div>
        <div class="dep-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktl.':'+'+dd+' min'}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('dep-results').innerHTML=depHeader()+rows+'</div></div>';
}
function renderDepT(times){
  if(!times.length){document.getElementById('dep-results').innerHTML='<div class="empty"><div class="empty-ico">😴</div><div class="empty-txt">Keine Abfahrten</div></div>';return;}
  const rows=times.map(t=>{
    const col=mc(t.mode);
    const n=t.routeShortName||t.displayName||'?';
    const dr=t.place?.departure, ds=t.place?.scheduledDeparture;
    const dd=t.realTime?dm(ds,dr):0;
    const tr=t.place?.track||t.place?.scheduledTrack||'';
    return`<div class="dep-cell">
      <span class="pill" style="background:${col};font-size:12px;flex-shrink:0">${n}</span>
      <div class="dep-info">
        <div class="dep-dest">${t.headsign||'?'}</div>
        ${tr?`<div class="dep-plat">Gleis ${tr}</div>`:''}
      </div>
      <div class="dep-right">
        <div class="dep-time">${ft(dr)}</div>
        ${t.realTime?`<div class="dep-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktl.':'+'+dd+' min'}</div>`:''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('dep-results').innerHTML=depHeader()+rows+'</div></div>';
}

/* ── Favorites ── */
function getFavs(){try{return JSON.parse(localStorage.getItem('zugFavs')||'[]');}catch{return[];}}
function setFavs(f){localStorage.setItem('zugFavs',JSON.stringify(f));}
function isFav(id){return getFavs().some(f=>f.id===id);}
function toggleFav(){
  if(!DEPST)return;
  let favs=getFavs();
  if(isFav(DEPST.id)) favs=favs.filter(f=>f.id!==DEPST.id);
  else favs.unshift({id:DEPST.id,name:DEPST.name,_ico:DEPST._ico||'🚉',_db:DEPST._db,lat:DEPST.lat,lon:DEPST.lon,products:DEPST.products,modes:DEPST.modes});
  setFavs(favs); loadDep();
}
function renderFavs(){
  const favs=getFavs();
  const box=document.getElementById('fav-content');
  if(!favs.length){
    box.innerHTML='<div class="empty"><div class="empty-ico">⭐</div><div class="empty-txt">Keine Favoriten</div><div class="empty-sub">Unter Abfahrten ★ tippen</div></div>';
    return;
  }
  box.innerHTML=`<div class="section" style="margin-top:0">
    <div class="section-title">Gespeicherte Bahnhöfe</div>
    <div class="cell-group">
      ${favs.map((f,i)=>`<div class="fav-cell">
        <div class="fav-ico">${f._ico||'🚉'}</div>
        <div class="fav-text" onclick="openFav(${i})" style="cursor:pointer">
          <div class="fav-name">${f.name}</div>
          <div class="fav-sub">Abfahrten ansehen</div>
        </div>
        <button class="fav-del" onclick="delFav('${f.id.replace(/'/g,"\\'")}')">✕</button>
      </div>`).join('')}
    </div>
  </div>`;
}
function openFav(i){
  const f=getFavs()[i]; if(!f)return;
  DEPST=f;
  document.getElementById('dep-input').value=f.name;
  document.querySelector('[data-p="dep"]').click();
  loadDep();
}
function delFav(id){setFavs(getFavs().filter(f=>f.id!==id));renderFavs();}
</script>
