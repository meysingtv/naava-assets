<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#ffffff"/>
  <title>Fahrplan</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    :root{
      --turq:#0fb9b1;
      --turq-d:#0a8f89;
      --turq-l:#e6faf8;
      --turq-grad:linear-gradient(135deg,#13c4bb,#06b6d4);
      --bg:#f4f7fa;
      --white:#ffffff;
      --line:#e7edf3;
      --text:#16222e;
      --muted:#7b8a9a;
      --muted2:#9aa9b8;
      --green:#10b981;
      --orange:#f59e0b;
      --red:#ef4444;
      --shadow:0 2px 16px rgba(20,40,60,0.06);
      --shadow-lg:0 8px 32px rgba(20,40,60,0.12);
      --nav-h:64px;
    }

    html,body{height:100%;overscroll-behavior:none}

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
    }

    /* ─── HEADER ─── */
    .topbar{
      background:var(--white);
      padding:calc(env(safe-area-inset-top,0) + 14px) 20px 14px;
      position:sticky;top:0;z-index:50;
      border-bottom:1px solid var(--line);
    }
    .topbar h1{
      font-size:22px;font-weight:800;letter-spacing:-0.5px;
      display:flex;align-items:center;gap:9px;
    }
    .topbar h1 .badge{
      width:30px;height:30px;border-radius:9px;
      background:var(--turq-grad);
      display:flex;align-items:center;justify-content:center;
      font-size:17px;box-shadow:0 3px 10px rgba(15,185,177,.35);
    }
    .topbar .sub{font-size:12px;color:var(--muted);margin-top:3px;margin-left:39px}

    /* ─── PAGE / SCROLL ─── */
    .page{
      display:none;
      padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 20px);
      max-width:620px;margin:0 auto;
    }
    .page.active{display:block;animation:fade .25s ease}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* ─── CARD ─── */
    .card{
      background:var(--white);
      border-radius:20px;
      box-shadow:var(--shadow);
      padding:18px;
      margin-bottom:14px;
    }

    /* ─── INPUT FIELD ─── */
    .field{position:relative;margin-bottom:10px}
    .field-label{
      font-size:10px;font-weight:800;text-transform:uppercase;
      letter-spacing:1px;color:var(--muted);margin-bottom:7px;
      display:flex;align-items:center;gap:7px;
    }
    .field-label .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .field-label .dot.end{background:var(--red)}

    .field input{
      width:100%;
      background:var(--bg);
      border:1.5px solid transparent;
      border-radius:14px;
      padding:15px 16px 15px 46px;
      color:var(--text);font-size:16px;outline:none;
      transition:border-color .2s,background .2s;
    }
    .field input:focus{background:var(--white);border-color:var(--turq)}
    .field input::placeholder{color:var(--muted2)}
    .field-icon{position:absolute;left:16px;bottom:15px;font-size:18px;pointer-events:none}

    /* ─── SUGGESTIONS ─── */
    .suggestions{
      position:absolute;top:calc(100% + 5px);left:0;right:0;
      background:var(--white);border:1px solid var(--line);
      border-radius:16px;z-index:500;overflow:hidden;
      max-height:320px;overflow-y:auto;box-shadow:var(--shadow-lg);
    }
    .sug-item{
      padding:13px 15px;display:flex;align-items:center;gap:13px;
      cursor:pointer;border-bottom:1px solid var(--line);
    }
    .sug-item:last-child{border-bottom:none}
    .sug-item:active{background:var(--turq-l)}
    .sug-badge{
      width:34px;height:34px;border-radius:10px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;background:var(--turq-l);
    }
    .sug-name{font-size:15px;font-weight:600;line-height:1.2}
    .sug-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .sug-loading{padding:16px;text-align:center;color:var(--muted);font-size:13px}

    /* ─── SWAP ─── */
    .swap-row{display:flex;align-items:center;gap:12px;margin:2px 0}
    .swap-line{flex:1;height:1px;background:var(--line)}
    .swap-btn{
      background:var(--turq-l);border:none;color:var(--turq-d);
      width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;
      display:flex;align-items:center;justify-content:center;
      transition:transform .25s;flex-shrink:0;
    }
    .swap-btn:active{transform:rotate(180deg);background:var(--turq);color:#fff}

    /* ─── TIME ROW ─── */
    .time-row{display:flex;gap:8px;margin-top:12px}
    .time-row select,.time-row input{
      flex:1;min-width:0;background:var(--bg);border:1.5px solid transparent;
      border-radius:14px;padding:13px 10px;color:var(--text);font-size:13px;
      outline:none;appearance:none;text-align:center;font-weight:600;
    }
    .time-row select:focus,.time-row input:focus{border-color:var(--turq);background:var(--white)}

    /* ─── PRIMARY BUTTON ─── */
    .go-btn{
      width:100%;background:var(--turq-grad);color:#fff;border:none;
      border-radius:16px;padding:17px;font-size:16px;font-weight:700;
      cursor:pointer;margin-top:14px;letter-spacing:.3px;
      box-shadow:0 6px 20px rgba(15,185,177,.32);
      transition:transform .1s,opacity .2s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .go-btn:active{transform:scale(.98)}
    .go-btn:disabled{opacity:.5;transform:none}

    /* ─── NOTICE / STATES ─── */
    .notice{
      background:var(--turq-l);color:var(--turq-d);
      border-radius:13px;padding:11px 15px;font-size:12.5px;font-weight:600;
      margin-bottom:13px;display:flex;gap:8px;align-items:center;
    }
    .spinner-wrap{display:flex;justify-content:center;padding:48px 0}
    .spinner{
      width:38px;height:38px;border:3px solid var(--line);
      border-top-color:var(--turq);border-radius:50%;animation:spin .65s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:50px 20px;color:var(--muted)}
    .empty .eicon{font-size:54px;margin-bottom:12px}
    .empty p{font-size:14px;line-height:1.5}
    .error-box{
      background:#fef2f2;border:1px solid #fecaca;border-radius:14px;
      padding:14px 16px;color:#dc2626;font-size:13px;line-height:1.5;
    }

    /* ─── JOURNEY CARD ─── */
    .jcard{
      background:var(--white);border-radius:18px;box-shadow:var(--shadow);
      margin-bottom:12px;overflow:hidden;cursor:pointer;
    }
    .jsummary{padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
    .jtime-block.right{text-align:right}
    .jtime{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1}
    .jdelay{font-size:11.5px;font-weight:700;margin-top:3px}
    .jdelay.ok{color:var(--green)}
    .jdelay.late{color:var(--orange)}
    .jstation{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
    .jstation.right{margin-left:auto}
    .jmid{text-align:center}
    .jline{position:relative;height:2px;background:var(--line);margin:8px 4px;border-radius:2px}
    .jline::before,.jline::after{content:'';position:absolute;top:50%;width:6px;height:6px;border-radius:50%;transform:translateY(-50%)}
    .jline::before{left:0;background:var(--green)}
    .jline::after{right:0;background:var(--red)}
    .jdur{font-size:13px;font-weight:800;color:var(--text)}
    .jchanges{font-size:10px;color:var(--muted);margin-top:2px}
    .jpills{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:8px}
    .pill{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px}
    .jexpand{display:flex;justify-content:center;padding:4px 0 12px;font-size:12px;color:var(--muted);gap:5px;align-items:center;font-weight:600}
    .chevron{display:inline-block;transition:transform .25s;font-size:9px}
    .chevron.open{transform:rotate(180deg)}

    /* ─── DETAIL ─── */
    .jdetail{border-top:1px solid var(--line);padding:16px 18px;display:none;background:#fafcfd}
    .jdetail.open{display:block}
    .leg{display:flex;gap:0}
    .leg-timeline{display:flex;flex-direction:column;align-items:center;width:34px;flex-shrink:0;padding-top:3px}
    .leg-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--white);flex-shrink:0;z-index:1;box-shadow:0 0 0 1.5px var(--line)}
    .leg-dot.s{background:var(--green);box-shadow:0 0 0 1.5px var(--green)}
    .leg-dot.e{background:var(--red);box-shadow:0 0 0 1.5px var(--red)}
    .leg-dot.t{background:var(--muted2)}
    .leg-track{width:3px;flex:1;min-height:26px;margin:2px 0;border-radius:3px}
    .leg-body{flex:1;padding-bottom:16px;padding-left:4px}
    .leg-stop{font-size:14px;font-weight:700;line-height:1.3}
    .leg-time-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
    .leg-t{font-size:15px;font-weight:800}
    .leg-delay{font-size:11px;font-weight:700}
    .leg-delay.ok{color:var(--green)}
    .leg-delay.late{color:var(--orange)}
    .leg-platform{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px;font-weight:600}
    .leg-transport{display:flex;align-items:center;gap:9px;padding:11px 0}
    .leg-dir{font-size:12px;color:var(--muted);line-height:1.3}
    .walk-leg{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:13px;color:var(--muted)}

    /* ─── DEPARTURE BOARD ─── */
    .dep-row{
      display:flex;align-items:center;gap:13px;padding:14px 4px;
      border-bottom:1px solid var(--line);
    }
    .dep-row:last-child{border-bottom:none}
    .dep-line{flex-shrink:0;min-width:54px;display:flex;justify-content:center}
    .dep-mid{flex:1;min-width:0}
    .dep-dest{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dep-track{font-size:11px;color:var(--muted);margin-top:2px}
    .dep-time{flex-shrink:0;text-align:right}
    .dep-t{font-size:17px;font-weight:800}
    .dep-d{font-size:11px;font-weight:700;margin-top:1px}
    .dep-d.ok{color:var(--green)}
    .dep-d.late{color:var(--orange)}

    /* ─── FAVORITES ─── */
    .fav-row{
      display:flex;align-items:center;gap:13px;padding:15px 4px;
      border-bottom:1px solid var(--line);cursor:pointer;
    }
    .fav-row:last-child{border-bottom:none}
    .fav-icon{width:40px;height:40px;border-radius:12px;background:var(--turq-l);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .fav-body{flex:1;min-width:0}
    .fav-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fav-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .fav-del{background:none;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:6px;flex-shrink:0}
    .fav-del:active{color:var(--red)}

    .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:4px 2px 10px}

    /* ─── BOTTOM NAV ─── */
    .navbar{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(14px);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      border-top:1px solid var(--line);
      display:flex;
      padding-bottom:env(safe-area-inset-bottom,0);
      height:calc(var(--nav-h) + env(safe-area-inset-bottom,0));
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;cursor:pointer;color:var(--muted2);
      border:none;background:none;font-family:inherit;
      transition:color .2s;height:var(--nav-h);
    }
    .nav-item .nico{font-size:21px;transition:transform .2s}
    .nav-item .nlbl{font-size:10.5px;font-weight:700;letter-spacing:.2px}
    .nav-item.active{color:var(--turq-d)}
    .nav-item.active .nico{transform:translateY(-1px) scale(1.08)}
  </style>
</head>
<body>

<div class="topbar">
  <h1><span class="badge">🚆</span> <span id="page-title">Verbindungen</span></h1>
  <div class="sub" id="page-sub">DB · Bus · Tram · U-Bahn in Deutschland</div>
</div>

<!-- ════════ TAB 1: SUCHE ════════ -->
<div class="page active" id="page-search">
  <div class="card">
    <div class="field">
      <div class="field-label"><span class="dot"></span> Von</div>
      <span class="field-icon">📍</span>
      <input type="text" id="from-input" placeholder="z.B. Köln Hbf" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="suggestions" id="from-sug" style="display:none"></div>
    </div>

    <div class="swap-row">
      <div class="swap-line"></div>
      <button class="swap-btn" onclick="swap()">⇅</button>
      <div class="swap-line"></div>
    </div>

    <div class="field">
      <div class="field-label"><span class="dot end"></span> Nach</div>
      <span class="field-icon">🏁</span>
      <input type="text" id="to-input" placeholder="z.B. Berlin Hbf" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="suggestions" id="to-sug" style="display:none"></div>
    </div>

    <div class="time-row">
      <select id="dep-arr">
        <option value="dep">Abfahrt</option>
        <option value="arr">Ankunft</option>
      </select>
      <input type="date" id="tdate"/>
      <input type="time" id="ttime"/>
    </div>

    <button class="go-btn" id="go-btn" onclick="search()"><span>🔍</span> Verbindungen suchen</button>
  </div>
  <div id="results"></div>
</div>

<!-- ════════ TAB 2: ABFAHRTEN ════════ -->
<div class="page" id="page-dep">
  <div class="card">
    <div class="field" style="margin-bottom:0">
      <div class="field-label"><span class="dot" style="background:var(--turq)"></span> Bahnhof / Haltestelle</div>
      <span class="field-icon">🚉</span>
      <input type="text" id="dep-input" placeholder="z.B. München Hbf" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="suggestions" id="dep-sug" style="display:none"></div>
    </div>
  </div>
  <div id="dep-results">
    <div class="empty">
      <div class="eicon">🕑</div>
      <p>Bahnhof eingeben für<br>die nächsten Abfahrten</p>
    </div>
  </div>
</div>

<!-- ════════ TAB 3: FAVORITEN ════════ -->
<div class="page" id="page-fav">
  <div class="card">
    <div class="section-title">Gespeicherte Bahnhöfe</div>
    <div id="fav-list"></div>
  </div>
</div>

<!-- ════════ BOTTOM NAV ════════ -->
<nav class="navbar">
  <button class="nav-item active" data-tab="search" onclick="switchTab('search')">
    <span class="nico">🔍</span><span class="nlbl">Suche</span>
  </button>
  <button class="nav-item" data-tab="dep" onclick="switchTab('dep')">
    <span class="nico">🕑</span><span class="nlbl">Abfahrten</span>
  </button>
  <button class="nav-item" data-tab="fav" onclick="switchTab('fav')">
    <span class="nico">⭐</span><span class="nlbl">Favoriten</span>
  </button>
</nav>

<script>
const GEOCODE = 'https://api.transitous.org/api/v1/geocode';
const PLAN    = 'https://api.transitous.org/api/v3/plan';
const STOPTIMES = 'https://api.transitous.org/api/v1/stoptimes';

let from = null, to = null, depStation = null;
let sugData = { from:[], to:[], dep:[] };
let debounce = {};

const now = new Date();
document.getElementById('tdate').value = now.toISOString().slice(0,10);
document.getElementById('ttime').value = now.toTimeString().slice(0,5);

/* ─── TABS ─── */
const TITLES = {
  search:['Verbindungen','DB · Bus · Tram · U-Bahn in Deutschland'],
  dep:['Abfahrten','Live-Abfahrtstafel'],
  fav:['Favoriten','Schnellzugriff auf deine Bahnhöfe'],
};
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${tab}`).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===tab));
  document.getElementById('page-title').textContent = TITLES[tab][0];
  document.getElementById('page-sub').textContent = TITLES[tab][1];
  if(tab==='fav') renderFavs();
  window.scrollTo(0,0);
}

/* ─── MODE INFO ─── */
function modeInfo(mode){
  switch((mode||'').toUpperCase()){
    case 'HIGHSPEED_RAIL': return {icon:'🚄',color:'#e2001a'};
    case 'LONG_DISTANCE':  return {icon:'🚆',color:'#c4000f'};
    case 'NIGHT_RAIL':     return {icon:'🌙',color:'#4c1d95'};
    case 'REGIONAL_FAST_RAIL':
    case 'REGIONAL_RAIL':
    case 'RAIL':           return {icon:'🚆',color:'#0079c2'};
    case 'METRO':
    case 'SUBWAY':         return {icon:'🚇',color:'#1c4b9b'};
    case 'TRAM':           return {icon:'🚋',color:'#d4145a'};
    case 'BUS':
    case 'COACH':          return {icon:'🚌',color:'#8b5cf6'};
    case 'FERRY':          return {icon:'⛴',color:'#0891b2'};
    case 'WALK':           return {icon:'🚶',color:'#94a3b8'};
    default:               return {icon:'🚉',color:'#64748b'};
  }
}
function stationIcon(modes){
  if(!modes||!modes.length) return '🚉';
  const order=['HIGHSPEED_RAIL','LONG_DISTANCE','REGIONAL_RAIL','METRO','SUBWAY','TRAM','BUS'];
  for(const o of order) if(modes.includes(o)) return modeInfo(o).icon;
  return modeInfo(modes[0]).icon;
}

/* ─── GEOCODE / AUTOCOMPLETE ─── */
async function fetchSug(q, field){
  if(q.length<2){ hideSug(field); return; }
  const box=document.getElementById(`${field}-sug`);
  box.innerHTML='<div class="sug-loading">Suche…</div>';
  box.style.display='block';
  try{
    const r=await fetch(`${GEOCODE}?text=${encodeURIComponent(q)}&language=de`);
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    const RAIL_MODES=['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL','REGIONAL_FAST_RAIL','REGIONAL_RAIL','RAIL','SUBURBAN'];
    const stops=(data||[]).filter(s=>s.type==='STOP');
    // Sortierung: Bahnhöfe mit echten Zugverbindungen zuerst, dann nach Wichtigkeit
    stops.sort((a,b)=>{
      const aRail=(a.modes||[]).some(m=>RAIL_MODES.includes(m));
      const bRail=(b.modes||[]).some(m=>RAIL_MODES.includes(m));
      if(aRail&&!bRail) return -1;
      if(!aRail&&bRail) return 1;
      return (b.importance||0)-(a.importance||0);
    });
    sugData[field]=stops.slice(0,10);
    renderSug(field);
  }catch(e){
    box.innerHTML='<div class="sug-loading">Suche fehlgeschlagen</div>';
  }
}
function renderSug(field){
  const box=document.getElementById(`${field}-sug`);
  const items=sugData[field];
  if(!items.length){ box.innerHTML='<div class="sug-loading">Kein Bahnhof gefunden</div>'; return; }
  box.innerHTML=items.map((s,i)=>{
    const city=(s.areas||[]).find(a=>a.adminLevel===6&&a.unique);
    const state=(s.areas||[]).find(a=>a.adminLevel===4);
    const sub=[city?.name,state?.name].filter(Boolean).join(' · ');
    return `<div class="sug-item" onclick="pick(${i},'${field}')">
      <div class="sug-badge">${stationIcon(s.modes)}</div>
      <div><div class="sug-name">${s.name}</div>${sub?`<div class="sug-sub">${sub}</div>`:''}</div>
    </div>`;
  }).join('');
}
function pick(idx, field){
  const s=sugData[field][idx];
  if(!s) return;
  document.getElementById(`${field}-input`).value=s.name;
  if(field==='from') from=s;
  else if(field==='to') to=s;
  else if(field==='dep'){ depStation=s; loadDepartures(); }
  hideSug(field);
}
function hideSug(field){ const b=document.getElementById(`${field}-sug`); if(b) b.style.display='none'; }
function setupField(field){
  const input=document.getElementById(`${field}-input`);
  input.addEventListener('input',()=>{
    if(field==='from')from=null; else if(field==='to')to=null; else depStation=null;
    clearTimeout(debounce[field]);
    debounce[field]=setTimeout(()=>fetchSug(input.value.trim(),field),220);
  });
  input.addEventListener('blur',()=>setTimeout(()=>hideSug(field),200));
  input.addEventListener('focus',()=>{
    if(input.value.length>=2&&sugData[field].length) document.getElementById(`${field}-sug`).style.display='block';
  });
}
setupField('from'); setupField('to'); setupField('dep');

function swap(){
  const fi=document.getElementById('from-input'),ti=document.getElementById('to-input');
  [fi.value,ti.value]=[ti.value,fi.value];
  [from,to]=[to,from];
}

/* ─── FORMAT ─── */
function fmt(iso){ return iso?new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'--:--'; }
function durStr(s){ if(!s||s<0)return'?'; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?`${h}h ${m}min`:`${m} min`; }
function delayMin(sched,act){ return (sched&&act)?Math.round((new Date(act)-new Date(sched))/60000):0; }
function delaySpan(sched,act){ const d=delayMin(sched,act); return d<=0?`<span class="leg-delay ok">pünktlich</span>`:`<span class="leg-delay late">+${d} min</span>`; }

/* ─── JOURNEY ─── */
function renderLeg(leg,isLast){
  if((leg.mode||'').toUpperCase()==='WALK'){
    const mins=Math.round((leg.duration||0)/60);
    return `<div class="leg"><div class="leg-timeline"><div class="leg-dot t"></div>
      <div class="leg-track" style="background:repeating-linear-gradient(to bottom,var(--muted2) 0,var(--muted2) 4px,transparent 4px,transparent 8px)"></div></div>
      <div class="leg-body"><div class="walk-leg">🚶 Fußweg · ${mins||1} min</div></div></div>`;
  }
  const mi=modeInfo(leg.mode);
  const name=leg.routeShortName||leg.displayName||leg.routeLongName||mi.icon;
  const dir=leg.headsign||leg.to?.name||'';
  const oT=leg.from?.track||leg.from?.scheduledTrack||'';
  const dT=leg.to?.track||leg.to?.scheduledTrack||'';
  const depR=leg.from?.departure||leg.startTime, depS=leg.from?.scheduledDeparture||leg.scheduledStartTime;
  const arrR=leg.to?.arrival||leg.endTime, arrS=leg.to?.scheduledArrival||leg.scheduledEndTime;
  return `<div class="leg"><div class="leg-timeline"><div class="leg-dot s"></div>
    <div class="leg-track" style="background:${mi.color}"></div></div>
    <div class="leg-body">
      <div class="leg-time-row"><span class="leg-t">${fmt(depR)}</span>${leg.realTime?delaySpan(depS,depR):''}</div>
      <div class="leg-stop">${leg.from?.name||'?'}</div>
      ${oT?`<span class="leg-platform">Gleis ${oT}</span>`:''}
      <div class="leg-transport"><span class="pill" style="background:${mi.color}">${name}</span><span class="leg-dir">Richtung ${dir}</span></div>
    </div></div>
    ${isLast?`<div class="leg"><div class="leg-timeline"><div class="leg-dot e"></div></div>
    <div class="leg-body"><div class="leg-time-row"><span class="leg-t">${fmt(arrR)}</span>${leg.realTime?delaySpan(arrS,arrR):''}</div>
    <div class="leg-stop">${leg.to?.name||'?'}</div>${dT?`<span class="leg-platform">Gleis ${dT}</span>`:''}</div></div>`:''}`;
}
function renderJourney(it,idx){
  const legs=it.legs||[];
  const transit=legs.filter(l=>(l.mode||'').toUpperCase()!=='WALK');
  if(!transit.length) return '';
  const f=transit[0],l=transit[transit.length-1];
  const depR=f.from?.departure||f.startTime||it.startTime, depS=f.from?.scheduledDeparture||f.scheduledStartTime||it.startTime;
  const arrR=l.to?.arrival||l.endTime||it.endTime, arrS=l.to?.scheduledArrival||l.scheduledEndTime||it.endTime;
  const changes=it.transfers??Math.max(0,transit.length-1);
  const dDep=f.realTime?delayMin(depS,depR):0, dArr=l.realTime?delayMin(arrS,arrR):0;
  const pills=transit.map(x=>{const mi=modeInfo(x.mode);return `<span class="pill" style="background:${mi.color}">${x.routeShortName||x.displayName||mi.icon}</span>`}).join('');
  return `<div class="jcard" onclick="toggleDetail(${idx})">
    <div class="jsummary">
      <div class="jtime-block"><div class="jtime">${fmt(depR)}</div><div class="jdelay ${dDep<=0?'ok':'late'}">${dDep<=0?'pünktlich':'+'+dDep+' min'}</div><div class="jstation">${from?.name||f.from?.name||''}</div></div>
      <div class="jmid"><div class="jdur">${durStr(it.duration)}</div><div class="jline"></div><div class="jchanges">${changes===0?'Direkt':changes+' Umst.'}</div><div class="jpills">${pills}</div></div>
      <div class="jtime-block right"><div class="jtime">${fmt(arrR)}</div><div class="jdelay ${dArr<=0?'ok':'late'}">${dArr<=0?'pünktlich':'+'+dArr+' min'}</div><div class="jstation right">${to?.name||l.to?.name||''}</div></div>
    </div>
    <div class="jexpand">Details <span class="chevron" id="chev-${idx}">▼</span></div>
    <div class="jdetail" id="detail-${idx}">${legs.map((lg,i)=>renderLeg(lg,i===legs.length-1)).join('')}</div>
  </div>`;
}
function toggleDetail(idx){
  document.getElementById(`detail-${idx}`).classList.toggle('open');
  document.getElementById(`chev-${idx}`).classList.toggle('open');
}

async function search(){
  if(!from||!to){ alert('Bitte Start- und Zielbahnhof aus der Liste auswählen.'); return; }
  const btn=document.getElementById('go-btn');
  btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Suche…';
  document.getElementById('results').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  const date=document.getElementById('tdate').value,time=document.getElementById('ttime').value;
  const arriveBy=document.getElementById('dep-arr').value==='arr';
  const when=new Date(`${date}T${time}:00`).toISOString();
  const params=new URLSearchParams({fromPlace:`${from.lat},${from.lon}`,toPlace:`${to.lat},${to.lon}`,time:when,arriveBy:String(arriveBy),numItineraries:'7'});
  try{
    const r=await fetch(`${PLAN}?${params}`);
    if(!r.ok) throw new Error(`Server ${r.status}`);
    const data=await r.json();
    // ICE/IC-Verbindungen herausfiltern — nur Nah- und Regionalverkehr
    const LONGDIST=['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL','COACH'];
    const filtered=(data.itineraries||[]).filter(it=>
      !it.legs.some(l=>LONGDIST.includes(l.mode))
    );
    const pool=filtered.length>0?filtered:(data.itineraries||[]);
    const cards=pool.map((it,i)=>renderJourney(it,i)).filter(Boolean);
    document.getElementById('results').innerHTML = cards.length
      ? `<div class="notice">✅ ${cards.length} Verbindungen — antippen für Details</div>`+cards.join('')
      : `<div class="empty"><div class="eicon">🔎</div><p>Keine Verbindungen gefunden.<br>Anderen Zeitpunkt versuchen.</p></div>`;
  }catch(e){
    document.getElementById('results').innerHTML=`<div class="error-box">❌ Fehler: ${e.message}<br>Bitte später erneut versuchen.</div>`;
  }finally{
    btn.disabled=false; btn.innerHTML='<span>🔍</span> Verbindungen suchen';
  }
}

/* ─── DEPARTURES ─── */
async function loadDepartures(){
  if(!depStation) return;
  const box=document.getElementById('dep-results');
  box.innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  try{
    const r=await fetch(`${STOPTIMES}?stopId=${encodeURIComponent(depStation.id)}&n=18&time=${new Date().toISOString()}`);
    if(!r.ok) throw new Error(`Server ${r.status}`);
    const data=await r.json();
    const st=data.stopTimes||[];
    if(!st.length){ box.innerHTML=`<div class="empty"><div class="eicon">😴</div><p>Keine Abfahrten gefunden.</p></div>`; return; }
    const rows=st.map(t=>{
      const mi=modeInfo(t.mode);
      const name=t.routeShortName||t.displayName||mi.icon;
      const depR=t.place?.departure,depS=t.place?.scheduledDeparture;
      const track=t.place?.track||t.place?.scheduledTrack;
      const d=t.realTime?delayMin(depS,depR):0;
      return `<div class="dep-row">
        <div class="dep-line"><span class="pill" style="background:${mi.color}">${name}</span></div>
        <div class="dep-mid"><div class="dep-dest">${t.headsign||t.tripTo?.name||'?'}</div>${track?`<div class="dep-track">Gleis ${track}</div>`:''}</div>
        <div class="dep-time"><div class="dep-t">${fmt(depR)}</div>${t.realTime?`<div class="dep-d ${d<=0?'ok':'late'}">${d<=0?'pünktl.':'+'+d+' min'}</div>`:''}</div>
      </div>`;
    }).join('');
    const saved=isFav(depStation.id);
    box.innerHTML=`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div class="section-title" style="margin:0">${depStation.name}</div>
        <button class="go-btn" style="width:auto;margin:0;padding:8px 14px;font-size:12px;box-shadow:none;background:${saved?'var(--muted2)':'var(--turq-grad)'}" onclick="toggleFav()">${saved?'✓ Gespeichert':'⭐ Merken'}</button>
      </div>${rows}</div>`;
  }catch(e){
    box.innerHTML=`<div class="error-box">❌ Fehler: ${e.message}</div>`;
  }
}

/* ─── FAVORITES (localStorage) ─── */
function getFavs(){ try{ return JSON.parse(localStorage.getItem('zugFavs')||'[]'); }catch(e){ return []; } }
function setFavs(f){ localStorage.setItem('zugFavs',JSON.stringify(f)); }
function isFav(id){ return getFavs().some(f=>f.id===id); }
function toggleFav(){
  if(!depStation) return;
  let favs=getFavs();
  if(isFav(depStation.id)) favs=favs.filter(f=>f.id!==depStation.id);
  else favs.unshift({id:depStation.id,name:depStation.name,modes:depStation.modes||[],lat:depStation.lat,lon:depStation.lon});
  setFavs(favs); loadDepartures();
}
function renderFavs(){
  const list=document.getElementById('fav-list');
  const favs=getFavs();
  if(!favs.length){ list.innerHTML=`<div class="empty"><div class="eicon">⭐</div><p>Noch keine Favoriten.<br>Bahnhof unter „Abfahrten" speichern.</p></div>`; return; }
  list.innerHTML=favs.map((f,i)=>`<div class="fav-row">
    <div class="fav-icon" onclick="openFav(${i})">${stationIcon(f.modes)}</div>
    <div class="fav-body" onclick="openFav(${i})"><div class="fav-title">${f.name}</div><div class="fav-sub">Abfahrten ansehen</div></div>
    <button class="fav-del" onclick="delFav('${f.id.replace(/'/g,"\\'")}')">✕</button>
  </div>`).join('');
}
function openFav(i){
  const f=getFavs()[i]; if(!f) return;
  depStation=f;
  document.getElementById('dep-input').value=f.name;
  switchTab('dep');
  loadDepartures();
}
function delFav(id){ setFavs(getFavs().filter(f=>f.id!==id)); renderFavs(); }
</script>
