<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a20"/>
      <stop offset="1" stop-color="#0c0c0f"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ff6b76"/>
      <stop offset="0.5" stop-color="#ff2b3d"/>
      <stop offset="1" stop-color="#b0101c"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3546"/>
      <stop offset="1" stop-color="#a50f18"/>
    </linearGradient>
  </defs>

  <!-- Antenne -->
  <line x1="100" y1="34" x2="100" y2="16" stroke="#3a3a44" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="12" r="7" fill="url(#eye)"/>
  <circle cx="100" cy="12" r="12" fill="#ff2b3d" opacity="0.35" filter="url(#soft)"/>

  <!-- Ohren -->
  <rect x="24" y="72" width="16" height="42" rx="8" fill="url(#edge)"/>
  <rect x="160" y="72" width="16" height="42" rx="8" fill="url(#edge)"/>

  <!-- Kopf -->
  <rect x="38" y="34" width="124" height="124" rx="40" fill="url(#body)" stroke="url(#edge)" stroke-width="2.5"/>

  <!-- Gesichtsfläche -->
  <rect x="52" y="52" width="96" height="82" rx="30" fill="url(#face)"/>

  <!-- Glow hinter Augen -->
  <ellipse cx="100" cy="92" rx="52" ry="34" fill="#ff2b3d" opacity="0.18" filter="url(#soft)"/>

  <!-- Augen -->
  <ellipse cx="80" cy="92" rx="13" ry="16" fill="url(#eye)"/>
  <ellipse cx="120" cy="92" rx="13" ry="16" fill="url(#eye)"/>
  <ellipse cx="80" cy="86" rx="5" ry="6" fill="#ffd0d4" opacity="0.9"/>
  <ellipse cx="120" cy="86" rx="5" ry="6" fill="#ffd0d4" opacity="0.9"/>

  <!-- Mund -->
  <path d="M84 118 Q100 128 116 118" stroke="#ff2b3d" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
