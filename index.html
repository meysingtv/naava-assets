<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#F2F2F7"/>
<title>Fahrplan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ios-bg:#F2F2F7;
  --ios-card:#FFFFFF;
  --ios-card2:#F9F9F9;
  --ios-sep:rgba(60,60,67,0.12);
  --ios-label:#000000;
  --ios-label2:rgba(60,60,67,0.6);
  --ios-label3:rgba(60,60,67,0.3);
  --ios-blue:#007AFF;
  --ios-red:#FF3B30;
  --ios-green:#34C759;
  --ios-orange:#FF9500;
  --ios-fill:rgba(120,120,128,0.12);
  --ios-fill2:rgba(120,120,128,0.08);
  --brand:#EC0016;
  --brand-d:#c4000f;
  --nav-h:83px;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,34px);
}
html,body{height:100%;background:var(--ios-bg);overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  color:var(--ios-label);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}

/* ══ NAVIGATION BAR ══ */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(242,242,247,0.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:0.5px solid var(--ios-sep);
}
.navbar-inner{
  padding:calc(var(--safe-top) + 8px) 20px 10px;
  display:flex;align-items:flex-end;justify-content:space-between;
}
.navbar-title{font-size:34px;font-weight:700;letter-spacing:-0.5px;line-height:1}
.navbar-badge{
  width:34px;height:34px;border-radius:10px;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  box-shadow:0 4px 12px rgba(236,0,22,.3);
  margin-bottom:2px;
}

/* ══ TAB BAR ══ */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(242,242,247,0.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:0.5px solid var(--ios-sep);
  display:flex;
  padding-bottom:var(--safe-bot);
  height:calc(49px + var(--safe-bot));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:none;background:none;
  cursor:pointer;color:var(--ios-label3);font-family:inherit;
  padding:8px 0 0;
}
.tab-icon{font-size:22px;line-height:1;transition:transform .15s}
.tab-label{font-size:10px;font-weight:500;letter-spacing:0.2px}
.tab.active{color:var(--brand)}
.tab.active .tab-icon{transform:scale(1.08)}

/* ══ PAGES ══ */
.page{
  display:none;
  padding-top:calc(var(--safe-top) + 84px);
  padding-bottom:calc(49px + var(--safe-bot) + 12px);
  min-height:100dvh;
}
.page.active{display:block}

/* ══ SCROLL CONTAINER ══ */
.scroll{padding:0 16px}

/* ══ SECTION HEADER ══ */
.section-hd{
  font-size:13px;font-weight:600;
  color:var(--ios-label2);
  text-transform:uppercase;letter-spacing:0.4px;
  padding:0 4px;margin:16px 0 6px;
}

/* ══ IOS GROUPED CARD ══ */
.ios-group{
  background:var(--ios-card);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:10px;
}
.ios-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
  min-height:52px;
  position:relative;
}
.ios-row:not(:last-child)::after{
  content:'';
  position:absolute;bottom:0;left:56px;right:0;
  height:0.5px;background:var(--ios-sep);
}
.ios-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.ios-icon.green{background:#34C759}
.ios-icon.red{background:#FF3B30}
.ios-icon.blue{background:#007AFF}
.ios-icon.orange{background:#FF9500}
.ios-row-body{flex:1;min-width:0}
.ios-row-label{font-size:17px;font-weight:400;color:var(--ios-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ios-row-sub{font-size:13px;color:var(--ios-label2);margin-top:1px}

/* ══ SEARCH INPUTS ══ */
.search-box{
  background:var(--ios-fill);
  border-radius:12px;
  padding:11px 14px 11px 40px;
  font-size:17px;font-family:inherit;
  color:var(--ios-label);
  border:none;outline:none;width:100%;
  transition:background .15s;
}
.search-box:focus{background:rgba(120,120,128,0.18)}
.search-box::placeholder{color:var(--ios-label3);font-size:17px}
.field-wrap{position:relative;margin-bottom:8px}
.field-icon-pos{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none;color:var(--ios-label2);
}
.field-lbl{
  font-size:11px;font-weight:600;letter-spacing:0.5px;
  text-transform:uppercase;color:var(--ios-label2);
  margin-bottom:5px;
}
.field-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:5px;vertical-align:middle;
}
.field-dot.g{background:var(--ios-green)}
.field-dot.r{background:var(--ios-red)}

/* ══ SWAP BUTTON ══ */
.swap-row{display:flex;align-items:center;gap:10px;margin:4px 0}
.swap-hr{flex:1;height:0.5px;background:var(--ios-sep)}
.swap-btn{
  width:34px;height:34px;border-radius:50%;
  background:var(--ios-fill);border:none;
  color:var(--ios-label2);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;
}
.swap-btn:active{transform:rotate(180deg) scale(0.92);background:var(--brand);color:#fff}

/* ══ TIME SELECTOR ══ */
.time-row{display:flex;gap:8px;margin-top:10px}
.time-pill{
  flex:1;background:var(--ios-fill);border-radius:10px;
  border:none;padding:10px 8px;
  font-size:14px;font-weight:600;font-family:inherit;
  color:var(--ios-label);text-align:center;
  appearance:none;outline:none;
}

/* ══ PRIMARY BUTTON ══ */
.cta{
  width:100%;background:var(--brand);color:#fff;
  border:none;border-radius:14px;padding:16px;
  font-size:17px;font-weight:600;font-family:inherit;
  cursor:pointer;margin-top:12px;letter-spacing:-0.2px;
  box-shadow:0 4px 16px rgba(236,0,22,.28);
  transition:transform .1s,opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.cta:active{transform:scale(.97);opacity:.9}
.cta:disabled{opacity:.4;transform:none;box-shadow:none}

/* ══ SUGGESTIONS ══ */
.sug-wrap{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:300;
  background:var(--ios-card);border-radius:14px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.14),0 0 0 0.5px rgba(0,0,0,.06);
  max-height:300px;overflow-y:auto;
}
.sug-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-bottom:0.5px solid var(--ios-sep);cursor:pointer;
}
.sug-row:last-child{border-bottom:none}
.sug-row:active{background:var(--ios-fill)}
.sug-icon{
  width:32px;height:32px;border-radius:8px;background:var(--ios-fill);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
}
.sug-name{font-size:16px;font-weight:500}
.sug-sub{font-size:12px;color:var(--ios-label2);margin-top:1px}
.sug-info{padding:14px;text-align:center;font-size:14px;color:var(--ios-label2)}

/* ══ RESULTS NOTICE ══ */
.result-notice{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--ios-label2);font-weight:500;
  padding:6px 4px 10px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--ios-green);
  box-shadow:0 0 0 0 rgba(52,199,89,.6);
  animation:pulse 2s ease infinite;flex-shrink:0;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 6px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}

/* ══ JOURNEY CARD ══ */
.jcard{
  background:var(--ios-card);border-radius:16px;
  margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06),0 0 0 0.5px rgba(0,0,0,.04);
  cursor:pointer;
}
.jcard:active{transform:scale(.99);opacity:.95}

.jhead{
  padding:14px 16px 12px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  align-items:start;
}

.jtime-col{}
.jtime-col.right{text-align:right}

.jtime-big{
  font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.jdelay-tag{
  display:inline-block;font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:20px;margin-top:4px;
}
.jdelay-tag.ok{background:rgba(52,199,89,.12);color:var(--ios-green)}
.jdelay-tag.late{background:rgba(255,59,48,.1);color:var(--ios-red)}
.jstation-name{font-size:11px;color:var(--ios-label2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.jmid-col{
  display:flex;flex-direction:column;align-items:center;
  padding:0 4px;
}
.jdur-text{font-size:13px;font-weight:600;color:var(--ios-label2)}
.jroute-bar{
  position:relative;height:3px;background:var(--ios-sep);
  width:100%;border-radius:2px;margin:6px 0;
}
.jroute-bar::before,.jroute-bar::after{
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;
}
.jroute-bar::before{left:-2px;background:var(--ios-green)}
.jroute-bar::after{right:-2px;background:var(--ios-red)}
.jchanges-text{font-size:11px;color:var(--ios-label2)}

.jpills-row{
  display:flex;gap:4px;flex-wrap:wrap;justify-content:center;
  padding:0 14px 12px;
}
.lpill{
  padding:3px 9px;border-radius:7px;
  font-size:12px;font-weight:800;color:#fff;letter-spacing:0.2px;
}

/* ══ DETAIL CHEVRON ══ */
.jchev-row{
  display:flex;align-items:center;justify-content:center;
  gap:5px;padding:8px 0 10px;
  border-top:0.5px solid var(--ios-sep);
  font-size:12px;color:var(--ios-label2);font-weight:500;
}
.chevron{display:inline-block;font-size:11px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.chevron.open{transform:rotate(180deg)}

/* ══ DETAIL VIEW ══ */
.jdetail{display:none;border-top:0.5px solid var(--ios-sep);padding:14px 16px 4px;background:var(--ios-card2)}
.jdetail.open{display:block}

.leg{display:flex;gap:10px;padding-bottom:4px}
.leg-tl{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0;padding-top:4px}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:2.5px solid var(--ios-card2);z-index:1}
.leg-dot.s{background:var(--ios-green)}
.leg-dot.e{background:var(--ios-red)}
.leg-dot.m{background:var(--ios-label2)}
.leg-track{width:3px;border-radius:2px;flex:1;min-height:24px;margin:2px 0}
.leg-body{flex:1;padding-bottom:16px}
.leg-t{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.leg-d{font-size:11px;font-weight:700;margin-left:6px}
.leg-d.ok{color:var(--ios-green)}
.leg-d.late{color:var(--ios-red)}
.leg-name{font-size:14px;font-weight:600;margin:2px 0}
.leg-sub{font-size:12px;color:var(--ios-label2)}
.leg-platform{
  display:inline-block;font-size:11px;font-weight:700;
  background:var(--ios-fill);border-radius:6px;
  padding:2px 8px;margin-top:4px;color:var(--ios-label2);
}
.leg-transport{
  display:flex;align-items:center;gap:8px;
  padding:10px 0 4px;
}
.leg-dir{font-size:13px;color:var(--ios-label2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.walk-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;font-size:13px;color:var(--ios-label2);
}

/* ══ DEPARTURE BOARD ══ */
.dep-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
}
.dep-item:not(:last-child){
  border-bottom:0.5px solid var(--ios-sep);
}
.dep-info{flex:1;min-width:0}
.dep-dest{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep-via{font-size:12px;color:var(--ios-label2);margin-top:2px}
.dep-right{text-align:right;flex-shrink:0}
.dep-time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.dep-delay{font-size:11px;font-weight:700;margin-top:2px}
.dep-delay.ok{color:var(--ios-green)}
.dep-delay.late{color:var(--ios-red)}
.dep-track{font-size:11px;color:var(--ios-label2);margin-top:1px}

/* ══ FAVORITE ══ */
.fav-item{display:flex;align-items:center;gap:14px;padding:12px 16px}
.fav-item:not(:last-child){border-bottom:0.5px solid var(--ios-sep)}
.fav-ico{width:40px;height:40px;border-radius:12px;background:rgba(236,0,22,.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.fav-body{flex:1;min-width:0}
.fav-name{font-size:16px;font-weight:600}
.fav-sub{font-size:13px;color:var(--ios-label2);margin-top:2px}
.fav-del{border:none;background:none;color:var(--ios-label3);font-size:22px;cursor:pointer;padding:6px;flex-shrink:0;line-height:1}
.fav-del:active{color:var(--ios-red)}

/* ══ STATES ══ */
.spinner-wrap{display:flex;justify-content:center;padding:60px 0}
.spinner{width:36px;height:36px;border:3px solid var(--ios-sep);border-top-color:var(--brand);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:56px 20px;color:var(--ios-label2)}
.empty-state .eico{font-size:56px;margin-bottom:12px;opacity:.8}
.empty-state .etxt{font-size:15px;line-height:1.5}
.err-box{background:rgba(255,59,48,.06);border-radius:14px;padding:16px;font-size:14px;color:var(--ios-red);line-height:1.5}

/* ══ SAVE BTN (Abfahrten) ══ */
.save-btn{
  background:none;border:none;cursor:pointer;
  font-size:22px;color:var(--ios-label3);padding:4px;
  line-height:1;transition:transform .15s;
}
.save-btn:active{transform:scale(1.25)}
.save-btn.saved{color:var(--ios-orange)}
</style>
</head>
<body>

<!-- ══ NAVIGATION BAR ══ -->
<div class="navbar">
  <div class="navbar-inner">
    <div class="navbar-title" id="nav-title">Verbindungen</div>
    <div class="navbar-badge">🚆</div>
  </div>
</div>

<!-- ══ PAGE: SUCHEN ══ -->
<div class="page active" id="page-search">
<div class="scroll">

  <div class="ios-group" style="padding:16px;margin-top:0">
    <!-- VON -->
    <div class="field-lbl"><span class="field-dot g"></span>Von</div>
    <div class="field-wrap" style="position:relative">
      <span class="field-icon-pos">📍</span>
      <input class="search-box" id="from-input" placeholder="Startbahnhof suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="sug-wrap" id="from-sug" style="display:none"></div>
    </div>

    <div class="swap-row">
      <div class="swap-hr"></div>
      <button class="swap-btn" onclick="swap()">⇅</button>
      <div class="swap-hr"></div>
    </div>

    <!-- NACH -->
    <div class="field-lbl"><span class="field-dot r"></span>Nach</div>
    <div class="field-wrap" style="position:relative">
      <span class="field-icon-pos">🏁</span>
      <input class="search-box" id="to-input" placeholder="Zielbahnhof suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="sug-wrap" id="to-sug" style="display:none"></div>
    </div>

    <!-- ZEIT -->
    <div class="time-row">
      <select class="time-pill" id="dep-arr">
        <option value="dep">Abfahrt</option>
        <option value="arr">Ankunft</option>
      </select>
      <input type="date" class="time-pill" id="tdate"/>
      <input type="time" class="time-pill" id="ttime"/>
    </div>

    <button class="cta" id="go-btn" onclick="search()">
      Verbindungen suchen
    </button>
  </div>

  <div id="results"></div>

</div>
</div>

<!-- ══ PAGE: ABFAHRTEN ══ -->
<div class="page" id="page-dep">
<div class="scroll">

  <div class="ios-group" style="padding:14px 16px;margin-top:0">
    <div class="field-wrap" style="position:relative">
      <span class="field-icon-pos">🔍</span>
      <input class="search-box" id="dep-input" placeholder="Bahnhof oder Haltestelle…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="sug-wrap" id="dep-sug" style="display:none"></div>
    </div>
  </div>

  <div id="dep-results">
    <div class="empty-state">
      <div class="eico">🕑</div>
      <div class="etxt">Bahnhof eingeben für<br>die nächsten Abfahrten</div>
    </div>
  </div>

</div>
</div>

<!-- ══ PAGE: FAVORITEN ══ -->
<div class="page" id="page-fav">
<div class="scroll">
  <div id="fav-content"></div>
</div>
</div>

<!-- ══ TAB BAR ══ -->
<div class="tabbar">
  <button class="tab active" data-page="search" onclick="goTab('search')">
    <span class="tab-icon">🔍</span>
    <span class="tab-label">Suchen</span>
  </button>
  <button class="tab" data-page="dep" onclick="goTab('dep')">
    <span class="tab-icon">🕑</span>
    <span class="tab-label">Abfahrten</span>
  </button>
  <button class="tab" data-page="fav" onclick="goTab('fav')">
    <span class="tab-icon">⭐</span>
    <span class="tab-label">Favoriten</span>
  </button>
</div>

<script>
'use strict';

const DB   = 'https://v6.db.transport.rest';
const GEO  = 'https://api.transitous.org/api/v1/geocode';
const PLAN = 'https://api.transitous.org/api/v3/plan';
const STOP = 'https://api.transitous.org/api/v1/stoptimes';

let from=null, to=null, depSt=null;
let sugCache={from:[],to:[],dep:[]};
let debounce={};
let useDB=true;

// Set current date/time
const now=new Date();
document.getElementById('tdate').value=now.toISOString().slice(0,10);
document.getElementById('ttime').value=now.toTimeString().slice(0,5);

/* ── TABS ── */
const TAB_TITLES={search:'Verbindungen',dep:'Abfahrten',fav:'Favoriten'};
function goTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===t));
  document.getElementById(`page-${t}`).classList.add('active');
  document.getElementById('nav-title').textContent=TAB_TITLES[t];
  if(t==='fav') renderFavs();
  window.scrollTo({top:0});
}

/* ── LINE COLORS ── */
function lineColor(name){
  if(!name) return '#8E8E93';
  const n=name.toUpperCase();
  if(/^ICE/.test(n)) return '#EC0016';
  if(/^IC|^EC|^TGV|^RJ/.test(n)) return '#c4000f';
  if(/^RE|^RB/.test(n)) return '#0066CC';
  if(/^S\d/.test(n)) return '#007E3C';
  if(/^U\d/.test(n)) return '#1C4B9B';
  if(/^STR|^T\d|^M\d/.test(n)) return '#C0003C';
  if(/BUS|NB|SEV/.test(n)) return '#7C3AED';
  if(/^FLX/.test(n)) return '#6DB33F';
  return '#555';
}
function modeColor(mode){
  switch((mode||'').toUpperCase()){
    case 'HIGHSPEED_RAIL':return '#EC0016';
    case 'LONG_DISTANCE': return '#c4000f';
    case 'NIGHT_RAIL':    return '#4C1D95';
    case 'REGIONAL_FAST_RAIL':
    case 'REGIONAL_RAIL':
    case 'RAIL':          return '#0066CC';
    case 'SUBURBAN':
    case 'METRO':
    case 'SUBWAY':        return '#007E3C';
    case 'TRAM':          return '#C0003C';
    case 'BUS':
    case 'COACH':         return '#7C3AED';
    case 'FERRY':         return '#0891B2';
    default:              return '#8E8E93';
  }
}
function modeIcon(modes){
  if(!modes||!modes.length) return '🚉';
  const p=['HIGHSPEED_RAIL','LONG_DISTANCE','REGIONAL_RAIL','SUBURBAN','SUBWAY','METRO','TRAM','BUS'];
  for(const m of p){
    if(modes.includes(m)){
      if(m==='HIGHSPEED_RAIL'||m==='LONG_DISTANCE') return '🚄';
      if(m==='REGIONAL_RAIL') return '🚆';
      if(m==='SUBURBAN') return '🚊';
      if(m==='SUBWAY'||m==='METRO') return '🚇';
      if(m==='TRAM') return '🚋';
      if(m==='BUS') return '🚌';
    }
  }
  return '🚉';
}
function dbModeIcon(products){
  if(!products) return '🚉';
  if(products.nationalExpress) return '🚄';
  if(products.national) return '🚅';
  if(products.regionalExpress||products.regional) return '🚆';
  if(products.suburban) return '🚊';
  if(products.subway) return '🚇';
  if(products.tram) return '🚋';
  if(products.bus) return '🚌';
  if(products.ferry) return '⛴';
  return '🚉';
}

/* ── FORMAT ── */
function fmt(iso){if(!iso)return'--:--';return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}
function durStr(s){if(!s||s<0)return'?';const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}h ${m}min`:`${m} min`;}
function dmin(s,a){if(!s||!a)return 0;return Math.round((new Date(a)-new Date(s))/60000);}

/* ── AUTOCOMPLETE ── */
async function fetchSug(q,field){
  if(q.length<2){hideSug(field);return;}
  showSugLoading(field,'Suche…');

  // Try DB HAFAS first
  if(useDB){
    try{
      const r=await fetch(`${DB}/locations?query=${encodeURIComponent(q)}&results=10&stops=true&addresses=false&poi=false`,{signal:AbortSignal.timeout(5000)});
      if(r.ok){
        const data=await r.json();
        sugCache[field]=(data||[]).map(s=>({
          id:s.id,name:s.name,lat:s.location?.latitude,lon:s.location?.longitude,
          products:s.products,_db:true,
          _icon:dbModeIcon(s.products)
        }));
        renderSug(field);return;
      }
    }catch(e){useDB=false;}
  }

  // Fallback Transitous
  try{
    const r=await fetch(`${GEO}?text=${encodeURIComponent(q)}&language=de`);
    if(!r.ok)throw new Error();
    const data=await r.json();
    const RAIL=['HIGHSPEED_RAIL','LONG_DISTANCE','REGIONAL_RAIL','REGIONAL_FAST_RAIL','SUBURBAN','RAIL'];
    const stops=(data||[]).filter(s=>s.type==='STOP');
    stops.sort((a,b)=>{
      const aR=(a.modes||[]).some(m=>RAIL.includes(m));
      const bR=(b.modes||[]).some(m=>RAIL.includes(m));
      if(aR&&!bR)return -1;if(!aR&&bR)return 1;
      return(b.importance||0)-(a.importance||0);
    });
    sugCache[field]=stops.slice(0,10).map(s=>({
      id:s.id,name:s.name,lat:s.lat,lon:s.lon,
      modes:s.modes,_db:false,
      _icon:modeIcon(s.modes)
    }));
    renderSug(field);
  }catch(e){showSugLoading(field,'Keine Ergebnisse');}
}

function showSugLoading(field,msg){
  const b=document.getElementById(`${field}-sug`);
  b.innerHTML=`<div class="sug-info">${msg}</div>`;
  b.style.display='block';
}
function renderSug(field){
  const b=document.getElementById(`${field}-sug`);
  const items=sugCache[field];
  if(!items.length){b.innerHTML='<div class="sug-info">Kein Bahnhof gefunden</div>';return;}
  b.innerHTML=items.map((s,i)=>`
    <div class="sug-row" onclick="pick(${i},'${field}')">
      <div class="sug-icon">${s._icon}</div>
      <div><div class="sug-name">${s.name}</div></div>
    </div>`).join('');
}
function pick(i,field){
  const s=sugCache[field][i];if(!s)return;
  document.getElementById(`${field}-input`).value=s.name;
  if(field==='from')from=s;
  else if(field==='to')to=s;
  else{depSt=s;loadDep();}
  hideSug(field);
}
function hideSug(f){const b=document.getElementById(`${f}-sug`);if(b)b.style.display='none';}
function setupField(field){
  const inp=document.getElementById(`${field}-input`);
  inp.addEventListener('input',()=>{
    if(field==='from')from=null;else if(field==='to')to=null;else depSt=null;
    clearTimeout(debounce[field]);
    debounce[field]=setTimeout(()=>fetchSug(inp.value.trim(),field),220);
  });
  inp.addEventListener('blur',()=>setTimeout(()=>hideSug(field),180));
  inp.addEventListener('focus',()=>{if(inp.value.length>=2&&sugCache[field].length)document.getElementById(`${field}-sug`).style.display='block';});
}
['from','to','dep'].forEach(setupField);

function swap(){
  const a=document.getElementById('from-input'),b=document.getElementById('to-input');
  [a.value,b.value]=[b.value,a.value];[from,to]=[to,from];
}

/* ── DB HAFAS JOURNEY RENDERER ── */
function renderDB(j,idx){
  const legs=(j.legs||[]);
  const transit=legs.filter(l=>!l.walking);
  if(!transit.length)return'';
  const f=transit[0],la=transit[transit.length-1];
  const depR=f.departure||f.plannedDeparture;
  const depS=f.plannedDeparture;
  const arrR=la.arrival||la.plannedArrival;
  const arrS=la.plannedArrival;
  const dDep=dmin(depS,depR),dArr=dmin(arrS,arrR);
  const changes=transit.length-1;
  const dur=(new Date(arrR)-new Date(depR))/1000;
  const pills=transit.map(l=>`<span class="lpill" style="background:${lineColor(l.line?.name)}">${l.line?.name||'?'}</span>`).join('');

  const detail=legs.map((leg,i)=>{
    if(leg.walking){
      const m=Math.ceil((new Date(leg.arrival)-new Date(leg.departure))/60000);
      return `<div class="leg">
        <div class="leg-tl"><div class="leg-dot m"></div>
        <div class="leg-track" style="background:repeating-linear-gradient(to bottom,#C6C6C8 0,#C6C6C8 4px,transparent 4px,transparent 9px)"></div></div>
        <div class="leg-body"><div class="walk-row">🚶 Fußweg · ${m||1} min</div></div></div>`;
    }
    const isLast=i===legs.length-1;
    const col=lineColor(leg.line?.name);
    const dR=leg.departure||leg.plannedDeparture,dS=leg.plannedDeparture;
    const aR=leg.arrival||leg.plannedArrival,aS=leg.plannedArrival;
    const dd=dmin(dS,dR),da=dmin(aS,aR);
    const oP=leg.departurePlatform||leg.plannedDeparturePlatform||'';
    const dP=leg.arrivalPlatform||leg.plannedArrivalPlatform||'';
    return`<div class="leg">
      <div class="leg-tl"><div class="leg-dot s"></div><div class="leg-track" style="background:${col}"></div></div>
      <div class="leg-body">
        <div style="display:flex;align-items:baseline"><span class="leg-t">${fmt(dR)}</span>${dd>0?`<span class="leg-d late">+${dd} min</span>`:`<span class="leg-d ok">pünktlich</span>`}</div>
        <div class="leg-name">${leg.origin?.name||'?'}</div>
        ${oP?`<span class="leg-platform">Gleis ${oP}</span>`:''}
        <div class="leg-transport">
          <span class="lpill" style="background:${col}">${leg.line?.name||'?'}</span>
          <span class="leg-dir">Richtung ${leg.direction||leg.destination?.name||''}</span>
        </div>
      </div></div>
    ${isLast?`<div class="leg">
      <div class="leg-tl"><div class="leg-dot e"></div></div>
      <div class="leg-body">
        <div style="display:flex;align-items:baseline"><span class="leg-t">${fmt(aR)}</span>${da>0?`<span class="leg-d late">+${da} min</span>`:`<span class="leg-d ok">pünktlich</span>`}</div>
        <div class="leg-name">${leg.destination?.name||'?'}</div>
        ${dP?`<span class="leg-platform">Gleis ${dP}</span>`:''}
      </div></div>`:''}`;
  }).join('');

  return`<div class="jcard" onclick="toggleD(${idx})">
    <div class="jhead">
      <div class="jtime-col">
        <div class="jtime-big">${fmt(depR)}</div>
        <span class="jdelay-tag ${dDep<=0?'ok':'late'}">${dDep<=0?'pünktlich':'+'+dDep+' min'}</span>
        <div class="jstation-name">${from?.name||f.origin?.name||''}</div>
      </div>
      <div class="jmid-col">
        <div class="jdur-text">${durStr(dur)}</div>
        <div class="jroute-bar"></div>
        <div class="jchanges-text">${changes===0?'Direkt':changes+' Umst.'}</div>
      </div>
      <div class="jtime-col right">
        <div class="jtime-big">${fmt(arrR)}</div>
        <span class="jdelay-tag ${dArr<=0?'ok':'late'}">${dArr<=0?'pünktlich':'+'+dArr+' min'}</span>
        <div class="jstation-name" style="text-align:right">${to?.name||la.destination?.name||''}</div>
      </div>
    </div>
    <div class="jpills-row">${pills}</div>
    <div class="jchev-row">Details <span class="chevron" id="chev-${idx}">▼</span></div>
    <div class="jdetail" id="detail-${idx}">${detail}</div>
  </div>`;
}

/* ── TRANSITOUS JOURNEY RENDERER ── */
function renderTransit(it,idx){
  const legs=it.legs||[];
  const SKIP=['HIGHSPEED_RAIL','LONG_DISTANCE','NIGHT_RAIL','COACH'];
  const transit=legs.filter(l=>l.mode!=='WALK');
  if(!transit.length||transit.some(l=>SKIP.includes(l.mode)))return'';
  const f=transit[0],la=transit[transit.length-1];
  const depR=f.from?.departure||f.startTime;
  const depS=f.from?.scheduledDeparture||f.scheduledStartTime;
  const arrR=la.to?.arrival||la.endTime;
  const arrS=la.to?.scheduledArrival||la.scheduledEndTime;
  const dDep=f.realTime?dmin(depS,depR):0;
  const dArr=la.realTime?dmin(arrS,arrR):0;
  const changes=it.transfers??Math.max(0,transit.length-1);
  const pills=transit.map(l=>{
    const n=l.routeShortName||l.displayName||'?';
    return`<span class="lpill" style="background:${modeColor(l.mode)}">${n}</span>`;
  }).join('');
  const detail=legs.map((leg,i)=>{
    if(leg.mode==='WALK'){
      const m=Math.round((leg.duration||0)/60);
      return`<div class="leg">
        <div class="leg-tl"><div class="leg-dot m"></div>
        <div class="leg-track" style="background:repeating-linear-gradient(to bottom,#C6C6C8 0,#C6C6C8 4px,transparent 4px,transparent 9px)"></div></div>
        <div class="leg-body"><div class="walk-row">🚶 Fußweg · ${m||1} min</div></div></div>`;
    }
    const isLast=i===legs.length-1;
    const col=modeColor(leg.mode);
    const n=leg.routeShortName||leg.displayName||'?';
    const dR=leg.from?.departure||leg.startTime,dS=leg.from?.scheduledDeparture||leg.scheduledStartTime;
    const aR=leg.to?.arrival||leg.endTime,aS=leg.to?.scheduledArrival||leg.scheduledEndTime;
    const dd=leg.realTime?dmin(dS,dR):0,da=leg.realTime?dmin(aS,aR):0;
    const oT=leg.from?.track||leg.from?.scheduledTrack||'';
    const dT=leg.to?.track||leg.to?.scheduledTrack||'';
    return`<div class="leg">
      <div class="leg-tl"><div class="leg-dot s"></div><div class="leg-track" style="background:${col}"></div></div>
      <div class="leg-body">
        <div style="display:flex;align-items:baseline"><span class="leg-t">${fmt(dR)}</span>${dd>0?`<span class="leg-d late">+${dd} min</span>`:`<span class="leg-d ok">pünktlich</span>`}</div>
        <div class="leg-name">${leg.from?.name||'?'}</div>
        ${oT?`<span class="leg-platform">Gleis ${oT}</span>`:''}
        <div class="leg-transport">
          <span class="lpill" style="background:${col}">${n}</span>
          <span class="leg-dir">Richtung ${leg.headsign||leg.to?.name||''}</span>
        </div>
      </div></div>
    ${isLast?`<div class="leg">
      <div class="leg-tl"><div class="leg-dot e"></div></div>
      <div class="leg-body">
        <div style="display:flex;align-items:baseline"><span class="leg-t">${fmt(aR)}</span>${da>0?`<span class="leg-d late">+${da} min</span>`:`<span class="leg-d ok">pünktlich</span>`}</div>
        <div class="leg-name">${leg.to?.name||'?'}</div>
        ${dT?`<span class="leg-platform">Gleis ${dT}</span>`:''}
      </div></div>`:''}`;
  }).join('');
  return`<div class="jcard" onclick="toggleD(${idx})">
    <div class="jhead">
      <div class="jtime-col">
        <div class="jtime-big">${fmt(depR)}</div>
        <span class="jdelay-tag ${dDep<=0?'ok':'late'}">${dDep<=0?'pünktlich':'+'+dDep+' min'}</span>
        <div class="jstation-name">${from?.name||f.from?.name||''}</div>
      </div>
      <div class="jmid-col">
        <div class="jdur-text">${durStr(it.duration)}</div>
        <div class="jroute-bar"></div>
        <div class="jchanges-text">${changes===0?'Direkt':changes+' Umst.'}</div>
      </div>
      <div class="jtime-col right">
        <div class="jtime-big">${fmt(arrR)}</div>
        <span class="jdelay-tag ${dArr<=0?'ok':'late'}">${dArr<=0?'pünktlich':'+'+dArr+' min'}</span>
        <div class="jstation-name" style="text-align:right">${to?.name||la.to?.name||''}</div>
      </div>
    </div>
    <div class="jpills-row">${pills}</div>
    <div class="jchev-row">Details <span class="chevron" id="chev-${idx}">▼</span></div>
    <div class="jdetail" id="detail-${idx}">${detail}</div>
  </div>`;
}

function toggleD(i){
  document.getElementById(`detail-${i}`).classList.toggle('open');
  document.getElementById(`chev-${i}`).classList.toggle('open');
}

/* ── SEARCH ── */
async function search(){
  if(!from||!to){alert('Bitte Start und Ziel aus der Liste auswählen.');return;}
  const btn=document.getElementById('go-btn');
  btn.disabled=true;btn.innerHTML='Suche läuft…';
  document.getElementById('results').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';
  const date=document.getElementById('tdate').value,time=document.getElementById('ttime').value;
  const arrBy=document.getElementById('dep-arr').value==='arr';
  const when=new Date(`${date}T${time}:00`).toISOString();

  // Try DB HAFAS
  if(useDB&&from._db&&to._db){
    try{
      const p=new URLSearchParams({from:from.id,to:to.id,results:'8',stopovers:'false',remarks:'false',language:'de'});
      p.set(arrBy?'arrival':'departure',when);
      const r=await fetch(`${DB}/journeys?${p}`,{signal:AbortSignal.timeout(8000)});
      if(r.ok){
        const d=await r.json();
        const cards=(d.journeys||[]).map((j,i)=>renderDB(j,i)).filter(Boolean);
        showResults(cards,'DB Echtzeit');
        done(btn);return;
      }
    }catch(e){useDB=false;}
  }

  // Transitous fallback
  try{
    const p=new URLSearchParams({fromPlace:`${from.lat},${from.lon}`,toPlace:`${to.lat},${to.lon}`,time:when,arriveBy:String(arrBy),numItineraries:'8'});
    const r=await fetch(`${PLAN}?${p}`);
    if(!r.ok)throw new Error(`Fehler ${r.status}`);
    const d=await r.json();
    const cards=(d.itineraries||[]).map((it,i)=>renderTransit(it,i)).filter(Boolean);
    showResults(cards,'Fahrplan');
  }catch(e){
    document.getElementById('results').innerHTML=`<div class="err-box">❌ ${e.message}</div>`;
  }
  done(btn);
}
function showResults(cards,src){
  const box=document.getElementById('results');
  if(!cards.length){
    box.innerHTML='<div class="empty-state"><div class="eicon">🔍</div><div class="etxt">Keine Verbindungen gefunden.<br>Anderen Zeitpunkt versuchen.</div></div>';
    return;
  }
  box.innerHTML=`<div class="result-notice"><div class="live-dot"></div>${cards.length} Verbindungen · ${src}</div>`+cards.join('');
}
function done(btn){btn.disabled=false;btn.innerHTML='Verbindungen suchen';}

/* ── DEPARTURES ── */
async function loadDep(){
  if(!depSt)return;
  const box=document.getElementById('dep-results');
  box.innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';

  // Try DB stoptimes
  if(useDB&&depSt._db){
    try{
      const r=await fetch(`${DB}/stops/${encodeURIComponent(depSt.id)}/departures?results=20&duration=120`,{signal:AbortSignal.timeout(6000)});
      if(r.ok){
        const data=await r.json();
        renderDepDB(data.departures||data);return;
      }
    }catch(e){useDB=false;}
  }

  // Transitous stoptimes
  try{
    const r=await fetch(`${STOP}?stopId=${encodeURIComponent(depSt.id)}&n=20&time=${new Date().toISOString()}`);
    if(!r.ok)throw new Error(`Fehler ${r.status}`);
    const data=await r.json();
    renderDepTransitous(data.stopTimes||[]);
  }catch(e){
    box.innerHTML=`<div class="err-box">❌ ${e.message}</div>`;
  }
}
function renderDepDB(deps){
  if(!deps.length){document.getElementById('dep-results').innerHTML='<div class="empty-state"><div class="eico">😴</div><div class="etxt">Keine Abfahrten</div></div>';return;}
  const saved=isFav(depSt.id);
  const rows=deps.map(d=>{
    const col=lineColor(d.line?.name);
    const depR=d.when||d.plannedWhen,depS=d.plannedWhen;
    const dd=dmin(depS,depR);
    const plat=d.platform||d.plannedPlatform||'';
    return`<div class="dep-item">
      <span class="lpill" style="background:${col};font-size:13px">${d.line?.name||'?'}</span>
      <div class="dep-info">
        <div class="dep-dest">${d.direction||'?'}</div>
        ${plat?`<div class="dep-via">Gleis ${plat}</div>`:''}
      </div>
      <div class="dep-right">
        <div class="dep-time">${fmt(depR)}</div>
        <div class="dep-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktl.':'+'+dd+' min'}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('dep-results').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px">
      <div class="section-hd" style="margin:0">${depSt.name}</div>
      <button class="save-btn ${saved?'saved':''}" onclick="toggleFav()" title="${saved?'Gespeichert':'Speichern'}">${saved?'★':'☆'}</button>
    </div>
    <div class="ios-group">${rows}</div>`;
}
function renderDepTransitous(times){
  if(!times.length){document.getElementById('dep-results').innerHTML='<div class="empty-state"><div class="eico">😴</div><div class="etxt">Keine Abfahrten</div></div>';return;}
  const saved=isFav(depSt.id);
  const rows=times.map(t=>{
    const col=modeColor(t.mode);
    const n=t.routeShortName||t.displayName||'?';
    const depR=t.place?.departure,depS=t.place?.scheduledDeparture;
    const dd=t.realTime?dmin(depS,depR):0;
    const track=t.place?.track||t.place?.scheduledTrack||'';
    return`<div class="dep-item">
      <span class="lpill" style="background:${col};font-size:13px">${n}</span>
      <div class="dep-info">
        <div class="dep-dest">${t.headsign||'?'}</div>
        ${track?`<div class="dep-via">Gleis ${track}</div>`:''}
      </div>
      <div class="dep-right">
        <div class="dep-time">${fmt(depR)}</div>
        ${t.realTime?`<div class="dep-delay ${dd<=0?'ok':'late'}">${dd<=0?'pünktl.':'+'+dd+' min'}</div>`:''}
      </div>
    </div>`;
  }).join('');
  document.getElementById('dep-results').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px">
      <div class="section-hd" style="margin:0">${depSt.name}</div>
      <button class="save-btn ${saved?'saved':''}" onclick="toggleFav()" title="${saved?'Gespeichert':'Speichern'}">${saved?'★':'☆'}</button>
    </div>
    <div class="ios-group">${rows}</div>`;
}

/* ── FAVORITES ── */
function getFavs(){try{return JSON.parse(localStorage.getItem('zugFavs')||'[]');}catch{return[];}}
function setFavs(f){localStorage.setItem('zugFavs',JSON.stringify(f));}
function isFav(id){return getFavs().some(f=>f.id===id);}
function toggleFav(){
  if(!depSt)return;
  let favs=getFavs();
  if(isFav(depSt.id))favs=favs.filter(f=>f.id!==depSt.id);
  else favs.unshift({id:depSt.id,name:depSt.name,_icon:depSt._icon||'🚉',_db:depSt._db,lat:depSt.lat,lon:depSt.lon,products:depSt.products,modes:depSt.modes});
  setFavs(favs);loadDep();
}
function renderFavs(){
  const favs=getFavs();
  const box=document.getElementById('fav-content');
  if(!favs.length){
    box.innerHTML='<div class="empty-state"><div class="eico">⭐</div><div class="etxt">Noch keine Favoriten.<br>Unter „Abfahrten" ★ tippen.</div></div>';
    return;
  }
  box.innerHTML=`<div class="section-hd">Gespeicherte Bahnhöfe</div>
  <div class="ios-group">
  ${favs.map((f,i)=>`<div class="fav-item">
    <div class="fav-ico">${f._icon||'🚉'}</div>
    <div class="fav-body" onclick="openFav(${i})" style="cursor:pointer">
      <div class="fav-name">${f.name}</div>
      <div class="fav-sub">Abfahrten ansehen →</div>
    </div>
    <button class="fav-del" onclick="delFav('${f.id.replace(/'/g,"\\'")}')">✕</button>
  </div>`).join('')}
  </div>`;
}
function openFav(i){
  const f=getFavs()[i];if(!f)return;
  depSt=f;
  document.getElementById('dep-input').value=f.name;
  goTab('dep');loadDep();
}
function delFav(id){setFavs(getFavs().filter(f=>f.id!==id));renderFavs();}
</script>
