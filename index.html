<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#0a0e1a"/>
  <title>ZugApp</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    :root{
      --red:#EC0016;
      --red2:#c4000f;
      --bg:#0a0e1a;
      --bg2:#111827;
      --card:#161d2e;
      --card2:#1c2438;
      --border:rgba(255,255,255,0.07);
      --text:#f1f5fb;
      --muted:#6b7fa3;
      --green:#10d97e;
      --orange:#f97316;
      --yellow:#facc15;
    }

    html,body{height:100%;overscroll-behavior:none}

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
    }

    /* ── HEADER ── */
    header{
      background:linear-gradient(135deg,#1a0005 0%,#2d0009 50%,#1a0510 100%);
      padding:env(safe-area-inset-top,0) 0 0;
      position:sticky;top:0;z-index:100;
      border-bottom:1px solid rgba(236,0,22,0.2);
    }

    .header-inner{
      display:flex;align-items:center;gap:12px;
      padding:14px 18px 14px;
    }

    .logo{
      width:36px;height:36px;
      background:var(--red);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;flex-shrink:0;
      box-shadow:0 0 20px rgba(236,0,22,0.4);
    }

    .header-text h1{font-size:18px;font-weight:800;letter-spacing:-0.5px}
    .header-text p{font-size:11px;color:rgba(255,255,255,0.5);margin-top:1px}

    /* ── MAIN ── */
    .main{padding:16px;max-width:600px;margin:0 auto}

    /* ── SEARCH CARD ── */
    .search-card{
      background:var(--card);
      border-radius:20px;
      border:1px solid var(--border);
      padding:18px;
      margin-bottom:16px;
      box-shadow:0 4px 32px rgba(0,0,0,0.4);
    }

    /* ── INPUT ── */
    .field{position:relative;margin-bottom:8px}

    .field-label{
      font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:1px;
      color:var(--muted);margin-bottom:6px;
      display:flex;align-items:center;gap:6px;
    }

    .field-label .dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--green);
      box-shadow:0 0 6px var(--green);
    }

    .field-label .dot.end{background:var(--red);box-shadow:0 0 6px var(--red)}

    .field input{
      width:100%;
      background:var(--bg2);
      border:1.5px solid var(--border);
      border-radius:12px;
      padding:14px 16px 14px 44px;
      color:var(--text);
      font-size:16px;
      outline:none;
      transition:border-color .2s,box-shadow .2s;
    }

    .field input:focus{
      border-color:rgba(236,0,22,0.6);
      box-shadow:0 0 0 3px rgba(236,0,22,0.1);
    }

    .field input::placeholder{color:var(--muted)}

    .field-icon{
      position:absolute;left:14px;bottom:14px;
      font-size:18px;pointer-events:none;
    }

    /* ── SUGGESTIONS ── */
    .suggestions{
      position:absolute;top:calc(100% + 4px);left:0;right:0;
      background:var(--card2);
      border:1px solid var(--border);
      border-radius:14px;
      z-index:500;
      overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,0.7);
    }

    .sug-item{
      padding:12px 14px;
      display:flex;align-items:center;gap:12px;
      cursor:pointer;
      border-bottom:1px solid var(--border);
      transition:background .1s;
    }

    .sug-item:last-child{border-bottom:none}
    .sug-item:active,.sug-item:hover{background:rgba(255,255,255,0.05)}

    .sug-badge{
      width:32px;height:32px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;flex-shrink:0;
      background:rgba(255,255,255,0.06);
    }

    .sug-name{font-size:14px;font-weight:600;line-height:1.2}
    .sug-sub{font-size:11px;color:var(--muted);margin-top:1px}

    /* ── DIVIDER ── */
    .swap-row{
      display:flex;align-items:center;gap:10px;
      margin:4px 0;
    }

    .swap-line{flex:1;height:1px;background:var(--border)}

    .swap-btn{
      background:var(--bg2);
      border:1px solid var(--border);
      color:var(--text);
      width:34px;height:34px;border-radius:50%;
      cursor:pointer;font-size:16px;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;flex-shrink:0;
    }
    .swap-btn:active{background:var(--red);border-color:var(--red);transform:rotate(180deg)}

    /* ── TIME ROW ── */
    .time-row{
      display:flex;gap:8px;margin-top:10px;
    }

    .time-row select,
    .time-row input[type=date],
    .time-row input[type=time]{
      flex:1;min-width:0;
      background:var(--bg2);
      border:1.5px solid var(--border);
      border-radius:12px;
      padding:11px 10px;
      color:var(--text);
      font-size:13px;
      outline:none;
      appearance:none;
      text-align:center;
    }

    .time-row select:focus,
    .time-row input:focus{border-color:rgba(236,0,22,0.5)}

    /* ── SEARCH BTN ── */
    .go-btn{
      width:100%;
      background:linear-gradient(135deg,var(--red),var(--red2));
      color:#fff;
      border:none;border-radius:14px;
      padding:16px;
      font-size:16px;font-weight:700;
      cursor:pointer;
      margin-top:14px;
      letter-spacing:0.3px;
      box-shadow:0 4px 20px rgba(236,0,22,0.35);
      transition:opacity .2s,transform .1s;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }

    .go-btn:active{opacity:.88;transform:scale(.98)}
    .go-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

    /* ── RESULTS ── */
    .results-label{
      font-size:12px;color:var(--muted);
      margin-bottom:10px;padding:0 2px;
      display:flex;align-items:center;gap:8px;
    }

    .results-label::after{
      content:'';flex:1;height:1px;background:var(--border);
    }

    /* ── JOURNEY CARD ── */
    .jcard{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      margin-bottom:12px;
      overflow:hidden;
      box-shadow:0 2px 16px rgba(0,0,0,0.3);
      cursor:pointer;
      transition:border-color .2s;
    }

    .jcard:active{border-color:rgba(236,0,22,0.4)}

    .jsummary{
      padding:16px;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
    }

    .jtime-block{}
    .jtime-block.right{text-align:right}

    .jtime{
      font-size:26px;font-weight:800;
      letter-spacing:-1px;line-height:1;
    }

    .jdelay{
      font-size:12px;font-weight:600;margin-top:2px;
    }

    .jdelay.ok{color:var(--green)}
    .jdelay.late{color:var(--orange)}

    .jstation{
      font-size:11px;color:var(--muted);
      margin-top:4px;
      white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;max-width:120px;
    }

    .jstation.right{margin-left:auto}

    .jmid{text-align:center}

    .jdur{
      font-size:13px;font-weight:700;
      color:var(--muted);
    }

    .jchanges{
      font-size:10px;color:var(--muted);
      margin-top:2px;
    }

    /* line pills */
    .jpills{
      display:flex;gap:4px;flex-wrap:wrap;
      justify-content:center;margin-top:8px;
    }

    .pill{
      padding:3px 8px;border-radius:6px;
      font-size:11px;font-weight:800;
      color:#fff;letter-spacing:0.3px;
    }

    /* divider arrow */
    .jarrow{
      font-size:11px;color:var(--muted);
      margin:6px 0;display:block;
    }

    /* expand icon */
    .jexpand{
      display:flex;justify-content:center;
      padding:6px 0 10px;
      font-size:12px;color:var(--muted);
      gap:4px;align-items:center;
    }

    .chevron{
      display:inline-block;
      transition:transform .25s;
      font-size:10px;
    }

    .chevron.open{transform:rotate(180deg)}

    /* ── DETAIL ── */
    .jdetail{
      border-top:1px solid var(--border);
      padding:14px 16px;
      display:none;
    }

    .jdetail.open{display:block}

    .leg{display:flex;gap:0;position:relative}

    .leg-timeline{
      display:flex;flex-direction:column;
      align-items:center;
      width:36px;flex-shrink:0;
      padding-top:3px;
    }

    .leg-dot{
      width:10px;height:10px;border-radius:50%;
      border:2px solid var(--bg);
      flex-shrink:0;
      z-index:1;
    }

    .leg-dot.s{background:var(--green)}
    .leg-dot.e{background:var(--red)}
    .leg-dot.t{background:var(--muted)}

    .leg-track{
      width:2px;flex:1;min-height:28px;
      margin:2px 0;
    }

    .leg-body{flex:1;padding-bottom:16px}

    .leg-stop{
      font-size:14px;font-weight:600;
      line-height:1.3;
    }

    .leg-time-row{
      display:flex;align-items:center;gap:8px;
      margin-bottom:4px;
    }

    .leg-t{font-size:15px;font-weight:800}
    .leg-delay{font-size:11px;font-weight:600}
    .leg-delay.ok{color:var(--green)}
    .leg-delay.late{color:var(--orange)}

    .leg-platform{
      font-size:11px;color:var(--muted);
      background:rgba(255,255,255,0.06);
      padding:2px 7px;border-radius:5px;
      display:inline-block;margin-top:3px;
    }

    .leg-transport{
      display:flex;align-items:center;gap:8px;
      padding:10px 0;
    }

    .leg-dir{font-size:12px;color:var(--muted);line-height:1.3}

    .walk-leg{
      display:flex;align-items:center;gap:8px;
      padding:10px 0;
      font-size:13px;color:var(--muted);
    }

    /* ── STATES ── */
    .spinner-wrap{
      display:flex;justify-content:center;
      padding:48px 0;
    }

    .spinner{
      width:40px;height:40px;
      border:3px solid var(--border);
      border-top-color:var(--red);
      border-radius:50%;
      animation:spin .65s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    .empty{
      text-align:center;padding:48px 20px;
      color:var(--muted);
    }

    .empty .eicon{font-size:52px;margin-bottom:12px}
    .empty p{font-size:14px}

    .error-box{
      background:rgba(239,68,68,.08);
      border:1px solid rgba(239,68,68,.25);
      border-radius:14px;
      padding:14px 16px;
      color:#f87171;
      font-size:13px;
    }

    /* ── NOTICE ── */
    .notice{
      background:rgba(16,217,126,.06);
      border:1px solid rgba(16,217,126,.15);
      border-radius:12px;
      padding:10px 14px;
      font-size:12px;
      color:var(--green);
      margin-bottom:12px;
      display:flex;gap:8px;align-items:center;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🚄</div>
    <div class="header-text">
      <h1>ZugApp</h1>
      <p>Echtzeitverbindungen in Deutschland</p>
    </div>
  </div>
</header>

<div class="main">

  <div class="search-card">

    <!-- VON -->
    <div class="field" id="field-from">
      <div class="field-label"><span class="dot"></span> Von</div>
      <span class="field-icon">📍</span>
      <input type="text" id="from-input" placeholder="Startbahnhof suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="suggestions" id="from-sug" style="display:none"></div>
    </div>

    <div class="swap-row">
      <div class="swap-line"></div>
      <button class="swap-btn" onclick="swap()" title="Tauschen">⇅</button>
      <div class="swap-line"></div>
    </div>

    <!-- NACH -->
    <div class="field" id="field-to">
      <div class="field-label"><span class="dot end"></span> Nach</div>
      <span class="field-icon">🏁</span>
      <input type="text" id="to-input" placeholder="Zielbahnhof suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <div class="suggestions" id="to-sug" style="display:none"></div>
    </div>

    <!-- ZEIT -->
    <div class="time-row">
      <select id="dep-arr">
        <option value="departure">Abfahrt</option>
        <option value="arrival">Ankunft</option>
      </select>
      <input type="date" id="tdate"/>
      <input type="time" id="ttime"/>
    </div>

    <button class="go-btn" id="go-btn" onclick="search()">
      <span>🔍</span> Verbindungen suchen
    </button>
  </div>

  <div id="results"></div>
</div>

<script>
const API = 'https://v6.db.transport.rest';

let from = null, to = null;
let sugData = { from: [], to: [] };
let debounce = {};

// Datum/Zeit vorbelegen
const now = new Date();
document.getElementById('tdate').value = now.toISOString().slice(0,10);
document.getElementById('ttime').value = now.toTimeString().slice(0,5);

// ── Farben nach Linienname ──
function lineColor(name){
  if(!name) return '#4b5563';
  const n = name.toUpperCase();
  if(/^ICE/.test(n)) return '#EC0016';
  if(/^IC|^EC/.test(n)) return '#c4000f';
  if(/^TGV|^RJ|^EST/.test(n)) return '#EC0016';
  if(/^RE|^RB/.test(n)) return '#0068b4';
  if(/^S\d/.test(n)) return '#007e3c';
  if(/^U\d/.test(n)) return '#213A8F';
  if(/^STR|^T\d/.test(n)) return '#c0003c';
  if(/^(BUS|NB|SEV|AST|TXI)/.test(n)) return '#7c3aed';
  if(/^FLX/.test(n)) return '#7fc12e';
  return '#374151';
}

function modeIcon(type){
  const t=(type||'').toLowerCase();
  if(t==='nationalexpress') return '🚄';
  if(t==='national') return '🚅';
  if(t==='regionalexpress'||t==='regional') return '🚆';
  if(t==='suburban') return '🚊';
  if(t==='subway') return '🚇';
  if(t==='tram') return '🚋';
  if(t==='bus'||t==='expressBus'||t==='taxi') return '🚌';
  if(t==='ferry') return '⛴';
  return '🚉';
}

function mainProduct(station){
  const p = station.products || {};
  const order = ['nationalExpress','national','regionalExpress','regional','suburban','subway','tram','bus'];
  return order.find(k=>p[k]) || '';
}

// ── Autocomplete ──
async function fetchSug(q, field){
  if(q.length < 2){
    hideSug(field); return;
  }
  try{
    const url = `${API}/locations?query=${encodeURIComponent(q)}&results=8&stops=true&addresses=false&poi=false`;
    const r = await fetch(url);
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    sugData[field] = data || [];
    renderSug(field);
  } catch(e){
    console.warn('Suche fehlgeschlagen:', e);
  }
}

function renderSug(field){
  const box = document.getElementById(`${field}-sug`);
  const items = sugData[field];
  if(!items || !items.length){ hideSug(field); return; }

  box.innerHTML = items.map((s,i)=>`
    <div class="sug-item" onclick="pick(${i},'${field}')">
      <div class="sug-badge">${modeIcon(mainProduct(s))}</div>
      <div>
        <div class="sug-name">${s.name}</div>
        ${s.state ? `<div class="sug-sub">${s.state}</div>` : ''}
      </div>
    </div>
  `).join('');
  box.style.display='block';
}

function pick(idx, field){
  const s = sugData[field][idx];
  if(!s) return;
  document.getElementById(`${field}-input`).value = s.name;
  if(field==='from') from=s; else to=s;
  hideSug(field);
}

function hideSug(field){
  const box = document.getElementById(`${field}-sug`);
  if(box) box.style.display='none';
}

function setupField(field){
  const input = document.getElementById(`${field}-input`);
  input.addEventListener('input', ()=>{
    clearTimeout(debounce[field]);
    debounce[field] = setTimeout(()=> fetchSug(input.value.trim(), field), 250);
  });
  input.addEventListener('blur', ()=>{
    setTimeout(()=> hideSug(field), 200);
  });
  input.addEventListener('focus', ()=>{
    if(input.value.length>=2) fetchSug(input.value.trim(), field);
  });
}

setupField('from');
setupField('to');

function swap(){
  const fi=document.getElementById('from-input');
  const ti=document.getElementById('to-input');
  [fi.value,ti.value]=[ti.value,fi.value];
  [from,to]=[to,from];
}

// ── Formatierung ──
function fmt(iso){
  if(!iso) return '--:--';
  return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

function dur(a,b){
  const ms = new Date(b)-new Date(a);
  if(ms<=0) return '?';
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return h>0 ? `${h}h ${m}min` : `${m} min`;
}

function delay(planned, actual){
  if(!actual||!planned) return 0;
  return Math.round((new Date(actual)-new Date(planned))/60000);
}

function delaySpan(planned, actual, suffix=''){
  const d = delay(planned, actual);
  if(d<=0) return `<span class="leg-delay ok">Pünktlich</span>`;
  return `<span class="leg-delay late">+${d} min${suffix}</span>`;
}

// ── Legs rendern ──
function renderLeg(leg, isLast){
  if(leg.walking || leg.transfer){
    const mins = Math.ceil((new Date(leg.arrival)-new Date(leg.departure))/60000);
    return `
      <div class="leg">
        <div class="leg-timeline">
          <div class="leg-dot t"></div>
          <div class="leg-track" style="background:repeating-linear-gradient(to bottom,var(--muted) 0,var(--muted) 4px,transparent 4px,transparent 8px)"></div>
        </div>
        <div class="leg-body">
          <div class="walk-leg">🚶 Fußweg ${leg.distance ? '('+Math.round(leg.distance)+' m)' : ''} · ${mins||1} min</div>
        </div>
      </div>`;
  }

  const line = leg.line || {};
  const color = lineColor(line.name||'');
  const dep = leg.departure || leg.plannedDeparture;
  const arr = leg.arrival || leg.plannedArrival;
  const pdep = leg.plannedDeparture;
  const parr = leg.plannedArrival;
  const oName = leg.origin?.name || '?';
  const dName = leg.destination?.name || '?';
  const oPlatform = leg.origin?.platform || leg.departurePlatform || '';
  const dPlatform = leg.destination?.platform || leg.arrivalPlatform || '';
  const dir = leg.direction || dName;

  return `
    <div class="leg">
      <div class="leg-timeline">
        <div class="leg-dot s"></div>
        <div class="leg-track" style="background:${color}"></div>
      </div>
      <div class="leg-body">
        <div class="leg-time-row">
          <span class="leg-t">${fmt(dep)}</span>
          ${delaySpan(pdep, dep)}
        </div>
        <div class="leg-stop">${oName}</div>
        ${oPlatform ? `<span class="leg-platform">Gleis ${oPlatform}</span>` : ''}
        <div class="leg-transport">
          <span class="pill" style="background:${color}">${line.name||'?'}</span>
          <span class="leg-dir">Richtung ${dir}</span>
        </div>
      </div>
    </div>
    ${isLast ? `
    <div class="leg">
      <div class="leg-timeline">
        <div class="leg-dot e"></div>
      </div>
      <div class="leg-body">
        <div class="leg-time-row">
          <span class="leg-t">${fmt(arr)}</span>
          ${delaySpan(parr, arr)}
        </div>
        <div class="leg-stop">${dName}</div>
        ${dPlatform ? `<span class="leg-platform">Gleis ${dPlatform}</span>` : ''}
      </div>
    </div>` : ''}
  `;
}

// ── Journey Card ──
function renderJourney(j, idx){
  const legs = (j.legs||[]).filter(l => !l.transfer && l.mode !== 'walking' && !l.walking || l.distance > 50);
  const realLegs = legs.filter(l => !l.walking && !l.transfer);
  if(!realLegs.length) return '';

  const first = realLegs[0];
  const last  = realLegs[realLegs.length-1];

  const depISO = first.departure || first.plannedDeparture;
  const arrISO = last.arrival   || last.plannedArrival;
  const pDepISO = first.plannedDeparture;
  const pArrISO = last.plannedArrival;

  const changes = realLegs.length - 1;
  const d = delay(pDepISO, depISO);

  const pills = realLegs.map(l =>
    `<span class="pill" style="background:${lineColor(l.line?.name||'')}">${l.line?.name||'?'}</span>`
  ).join('');

  return `
    <div class="jcard" id="jcard-${idx}" onclick="toggleDetail(${idx})">
      <div class="jsummary">
        <div class="jtime-block">
          <div class="jtime">${fmt(depISO)}</div>
          <div class="jdelay ${d<=0?'ok':'late'}">${d<=0?'Pünktlich':'+'+d+' min'}</div>
          <div class="jstation">${first.origin?.name||''}</div>
        </div>

        <div class="jmid">
          <div class="jdur">${dur(depISO, arrISO)}</div>
          <div class="jchanges">${changes===0?'Direkt':changes+' Umstieg'+(changes>1?'e':'')}</div>
          <div class="jpills">${pills}</div>
        </div>

        <div class="jtime-block right">
          <div class="jtime">${fmt(arrISO)}</div>
          <div class="jdelay ${delay(pArrISO,last.arrival||last.plannedArrival)<=0?'ok':'late'}">
            ${delay(pArrISO,last.arrival||last.plannedArrival)<=0?'Pünktlich':'+'+delay(pArrISO,last.arrival||last.plannedArrival)+' min'}
          </div>
          <div class="jstation right">${last.destination?.name||''}</div>
        </div>
      </div>

      <div class="jexpand">
        Details <span class="chevron" id="chev-${idx}">▼</span>
      </div>

      <div class="jdetail" id="detail-${idx}">
        ${legs.map((leg, i) => renderLeg(leg, i === legs.length-1)).join('')}
      </div>
    </div>`;
}

function toggleDetail(idx){
  const d = document.getElementById(`detail-${idx}`);
  const c = document.getElementById(`chev-${idx}`);
  d.classList.toggle('open');
  c.classList.toggle('open');
}

// ── Suche ──
async function search(){
  if(!from || !to){
    alert('Bitte Start- und Zielbahnhof aus der Liste auswählen.');
    return;
  }

  const btn = document.getElementById('go-btn');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner" style="width:20px;height:20px;border-width:2px"></div> Suche läuft…';
  document.getElementById('results').innerHTML='<div class="spinner-wrap"><div class="spinner"></div></div>';

  const date = document.getElementById('tdate').value;
  const time = document.getElementById('ttime').value;
  const depArr = document.getElementById('dep-arr').value;
  const when = new Date(`${date}T${time}:00`).toISOString();

  const url = `${API}/journeys?from=${encodeURIComponent(from.id)}&to=${encodeURIComponent(to.id)}&${depArr}=${encodeURIComponent(when)}&results=6&stopovers=false&remarks=false&language=de`;

  try{
    const r = await fetch(url);
    if(!r.ok){
      const txt = await r.text();
      throw new Error(`Server ${r.status}: ${txt.slice(0,100)}`);
    }
    const data = await r.json();
    const journeys = (data.journeys||[]);

    if(!journeys.length){
      document.getElementById('results').innerHTML=`
        <div class="empty">
          <div class="eicon">🔎</div>
          <p>Keine Verbindungen gefunden.<br>Versuche einen anderen Zeitraum.</p>
        </div>`;
    } else {
      const cards = journeys.map((j,i)=>renderJourney(j,i)).filter(Boolean);
      document.getElementById('results').innerHTML=
        `<div class="notice">✅ ${cards.length} Verbindungen gefunden — Karte antippen für Details</div>`+
        cards.join('');
    }
  } catch(e){
    document.getElementById('results').innerHTML=`
      <div class="error-box">
        ❌ Fehler: ${e.message}<br><br>
        Bitte Verbindung prüfen oder später nochmal versuchen.
      </div>`;
    console.error(e);
  } finally {
    btn.disabled=false;
    btn.innerHTML='<span>🔍</span> Verbindungen suchen';
  }
}
</script>
</body>
