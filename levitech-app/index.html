<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>LEVITECH — IT-Service App</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="img/bot.svg">
</head>
<body>
  <div class="device">
    <div class="notch"></div>

    <!-- Statusbar -->
    <div class="statusbar">
      <span class="time" id="sb-time">9:41</span>
      <span class="icons" id="sb-icons"></span>
    </div>

    <!-- Scroll-Bereich (Screens werden hier gerendert) -->
    <div class="viewport" id="viewport"></div>

    <!-- Floating Action Button (nur Tickets) -->
    <button class="fab" id="fab" onclick="toast('Neues Ticket erstellen')" style="display:none"></button>

    <!-- Bottom Navigation -->
    <div class="tabbar" id="tabbar"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
